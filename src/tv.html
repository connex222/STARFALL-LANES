<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall Lanes — TV</title>
<link rel="icon" type="image/svg+xml" href="art/brand/starfall-mark.svg">
<style>
/*CSS*/
html{font-size:clamp(14px,1.15vw,26px)}
body{overflow:hidden;background:#070A16}
#app{position:fixed;inset:0;display:grid;grid-template-columns:15.5rem 1fr 15rem;grid-template-rows:auto 1fr auto;grid-template-areas:"top top top" "rail map side" "tick tick tick"}
#top{grid-area:top;display:flex;align-items:center;gap:1.4rem;padding:.6rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--line)}
#top .era{font-family:Orbitron;font-weight:900;font-size:1.05rem}
#top .round{color:var(--muted);font-weight:600}
#top .phase{margin-left:auto;font-weight:800;font-size:1.1rem;display:flex;gap:.6rem;align-items:center}
#top .timer{font-family:Inter;font-weight:800;font-size:1.3rem;min-width:4.2ch;text-align:right;font-variant-numeric:tabular-nums}
#top .timer.low{color:var(--bad)}
#top .storm{display:flex;align-items:center;gap:.4rem;font-weight:800;color:var(--storm)}
#top .storm i{display:inline-block;width:1.2rem;height:1.2rem;border-radius:3px;background:repeating-linear-gradient(135deg,var(--storm) 0 4px,transparent 4px 8px);border:2px solid var(--storm)}
#rail{grid-area:rail;overflow:hidden;padding:.6rem;display:flex;flex-direction:column;gap:.45rem;background:linear-gradient(90deg,rgba(20,26,46,.85),rgba(20,26,46,.4))}
.house{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;padding:.45rem .55rem;border-radius:.7rem;background:var(--panel);border:2px solid transparent;position:relative}
.house.first::before{content:"1st";position:absolute;left:-.25rem;top:-.35rem;font-size:.6rem;font-weight:800;background:var(--accent);color:var(--accentText);padding:0 .3rem;border-radius:.4rem}
.house.turn{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,214,255,.25)}
.house .nm{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.house .meta{font-size:.72rem;color:var(--muted);display:flex;gap:.55rem;margin-top:.1rem}
.house .inf{font-family:Inter;font-weight:800;font-size:1.5rem;text-align:right;line-height:1}
.house .inf small{display:block;font-family:Inter;font-weight:600;font-size:.55rem;color:var(--muted);letter-spacing:.03em}
.house .st{font-size:.72rem;font-weight:800;margin-top:.15rem}
.house .st.ok{color:var(--good)}.house .st.wait{color:var(--muted)}.house .st.off{color:var(--bad)}
.gain{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.2rem;font-size:.75rem;font-weight:800;animation:pop .5s}
.gain span{display:inline-flex;align-items:center;gap:.15rem}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#map{grid-area:map;position:relative;min-height:0}
#map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#side{grid-area:side;padding:.6rem;display:flex;flex-direction:column;gap:.6rem;overflow:hidden;background:linear-gradient(270deg,rgba(20,26,46,.85),rgba(20,26,46,.4))}
#side h3{font-size:.8rem;color:var(--muted);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.5rem .6rem;position:relative}
.card b{display:block;font-size:.88rem}
.card p{font-size:.72rem;color:var(--muted);margin-top:.15rem;line-height:1.3}
.card .tag{position:absolute;right:.45rem;top:.4rem;font-size:.6rem;font-weight:800;color:var(--accent)}
.card.flash{animation:flash 1s}
@keyframes flash{30%{background:var(--accent);color:var(--accentText)}}
.event{border:2px solid var(--gold)}
.trophy{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:700}
.trophy .who{margin-left:auto;font-weight:800}
#tick{grid-area:tick;display:flex;align-items:center;gap:1rem;padding:.55rem 1.2rem;background:var(--panel);border-top:1px solid var(--line);min-height:3.2rem}
#tick .now{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#tick .prev{font-size:.78rem;color:var(--muted);max-width:32%;margin-right:15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner{position:absolute;left:50%;top:1rem;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.6rem 1.2rem;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.8rem;box-shadow:var(--shadow);max-width:90%;text-align:center}
#banner:empty{display:none}
#popup{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%);display:none}
#popup.show{display:block;animation:pop .35s}
.clash{background:var(--panel);border-radius:1rem;padding:.8rem 1.2rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:1.2rem;border:2px solid var(--line)}
.clash .side{text-align:center;min-width:8rem}
.clash .sum{font-family:Inter;font-weight:800;font-size:2.2rem}
.clash .bd{font-size:.72rem;color:var(--muted)}
.clash .vs{font-family:Orbitron;font-weight:900;color:var(--muted)}
.clash .win .sum{color:var(--good)}
.die{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:.35rem;background:rgba(51,214,255,.18);border:2px solid var(--accent);font-weight:900;margin:0 .15rem}
.big{position:absolute;inset:0;display:none;place-items:center;background:rgba(7,10,22,.72);backdrop-filter:blur(3px)}
.big.show{display:grid}
.big .inner{text-align:center;max-width:80%;animation:pop .5s}
.big h2{font-size:3rem;font-weight:900;margin-bottom:.5rem}
.big p{font-size:1.1rem;color:var(--muted)}
.ups{display:flex;gap:1rem;justify-content:center;margin-top:1.2rem}
.ups .card{width:14rem;text-align:left}
#lobby{position:fixed;inset:0;display:none;grid-template-columns:1.15fr 1fr;gap:3rem;padding:3rem 4rem;align-items:center}
#lobby.show{display:grid}
#lobby canvas.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#lobby h1{font-size:4.2rem;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#9ff0ff 60%,#33D6FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(51,214,255,.4))}
#lobby .sub{font-size:1.15rem;color:var(--muted);margin-top:.6rem}
.join{display:flex;gap:2rem;align-items:center;margin-top:2.4rem;background:var(--panel);padding:1.4rem;border-radius:1.2rem;border:1px solid var(--line);width:max-content;max-width:100%}
.join canvas{width:11rem;height:11rem;border-radius:.6rem;background:#fff}
.code{font-family:Orbitron;font-weight:900;font-size:4.2rem;letter-spacing:.18em;color:var(--accent)}
.join .url{font-size:.95rem;color:var(--muted);margin-top:.4rem;word-break:break-all}
.join .lbl{font-size:.9rem;font-weight:700}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.slot{display:flex;align-items:center;gap:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.7rem;min-height:4.6rem}
.slot.empty{border-style:dashed;color:var(--muted);justify-content:center;font-size:.9rem;background:transparent}
.slot b{display:block}.slot small{color:var(--muted);font-size:.75rem}
.lobbyMode{margin-top:1.2rem;font-weight:800;font-size:1.1rem}
.lobbyMode span{color:var(--accent)}
#sound{position:fixed;right:.8rem;bottom:.55rem;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:2rem;padding:.4rem .9rem;font-weight:700;font-size:.8rem}
#conn{position:fixed;left:50%;top:.5rem;transform:translateX(-50%);z-index:30;background:var(--bad);color:#fff;font-weight:800;padding:.4rem 1rem;border-radius:1rem;display:none}
#conn.show{display:block}
.over table{margin:1.2rem auto 0;border-collapse:collapse;font-size:1rem}
.over td,.over th{padding:.35rem .9rem;text-align:left}
.over th{color:var(--muted);font-size:.75rem;font-weight:700}
.over td.n{font-family:Inter;font-weight:800;text-align:right}
.over tr.win td{color:var(--gold)}
/* Phase 1 + 2: cinematic TV shell and responsive lobby */
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body{background:radial-gradient(circle at 52% 37%,#103154 0%,#081427 46%,#040a17 100%)}
#lobby{isolation:isolate;gap:clamp(1.5rem,4vw,4.5rem);padding:clamp(1.4rem,4vw,4rem);background:radial-gradient(ellipse at 22% 43%,rgba(16,93,147,.34),transparent 44%),linear-gradient(114deg,rgba(2,11,25,.54),rgba(2,10,25,.64))}
#lobby:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(2,10,23,.13),rgba(2,10,23,.43)),repeating-linear-gradient(0deg,transparent 0 91px,rgba(75,176,229,.035) 92px),repeating-linear-gradient(90deg,transparent 0 91px,rgba(75,176,229,.035) 92px)}
#lobby>div{position:relative;z-index:1;min-width:0}
#lobby .lobby-logo{display:block;width:min(100%,39rem);height:auto;filter:drop-shadow(0 0 24px rgba(31,192,255,.24))}
.brand-kicker{display:flex;align-items:center;gap:.7rem;margin-bottom:1.3rem;font-size:.78rem;letter-spacing:.26em;font-weight:800;color:#91cae9}
.brand-kicker .signal{width:9px;height:9px;background:#38d9ff;box-shadow:0 0 16px #38d9ff;transform:rotate(45deg)}
#lobby .sub{line-height:1.55;max-width:42rem;color:#c1d3e6}
#lobby .join{width:100%;background:linear-gradient(130deg,rgba(13,31,54,.92),rgba(12,24,44,.78));border-color:rgba(93,195,241,.42);box-shadow:inset 0 1px 0 rgba(163,219,250,.14),0 18px 52px rgba(0,0,0,.34)}
#lobby .code{letter-spacing:.13em;text-shadow:0 0 20px rgba(55,212,255,.48)}
#lobby .join canvas{flex:none;box-shadow:0 0 25px rgba(24,204,255,.18)}
#lobby .roster{align-content:center}
#lobby .slot{min-width:0;min-height:5.2rem;border:1px solid rgba(107,183,225,.28);background:linear-gradient(125deg,rgba(20,41,68,.91),rgba(11,26,47,.89));box-shadow:inset 0 1px 0 rgba(157,227,255,.06)}
#lobby .slot:not(.empty){border-left:3px solid rgba(76,201,247,.65)}
#lobby .slot.empty{border:1px dashed rgba(92,148,185,.27);background:rgba(7,22,40,.23)}
#lobby .slot b{max-width:15rem;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
#top{background:linear-gradient(90deg,rgba(9,26,46,.97),rgba(12,31,52,.95));border-color:rgba(98,180,228,.22);box-shadow:0 8px 27px rgba(0,0,0,.22)}
#top .top-logo{width:2.6rem;height:2.6rem;filter:drop-shadow(0 0 12px rgba(38,211,255,.28));margin-right:.2rem}
#top .era{color:#d6ecfa}
#rail{background:linear-gradient(90deg,rgba(4,14,31,.96),rgba(9,24,45,.68));border-right:1px solid rgba(94,170,214,.16)}
#rail .house{background:linear-gradient(100deg,rgba(22,43,71,.93),rgba(10,25,45,.93));border:1px solid rgba(80,159,210,.25);border-left:3px solid var(--line);box-shadow:inset 0 1px 0 rgba(155,212,255,.05)}
#rail .house.turn{border-color:var(--accent)}
#side{background:linear-gradient(270deg,rgba(4,14,31,.96),rgba(8,24,44,.83));border-left:1px solid rgba(94,170,214,.16)}
#side .card{background:linear-gradient(120deg,rgba(18,43,69,.96),rgba(12,28,49,.94));border-color:rgba(88,170,221,.26)}
#tick{background:rgba(6,20,39,.98);border-color:rgba(96,179,221,.23)}
#banner{background:rgba(7,26,47,.95);border-color:rgba(82,205,255,.49)}
@media(max-width:1100px){#lobby{grid-template-columns:1fr 1fr;gap:1.2rem;padding:1.4rem}#lobby .join{gap:.75rem;padding:.75rem}#lobby .join canvas{width:8rem;height:8rem}#lobby .code{font-size:2.7rem}#lobby .slot{gap:.45rem;padding:.4rem}}
@media(max-width:760px){#lobby{grid-template-columns:1fr;overflow:auto;align-items:start;gap:1rem}#lobby .lobby-logo{max-width:26rem}#lobby .roster{grid-template-columns:repeat(2,minmax(0,1fr))}#lobby .join{margin-top:1.1rem}}

/* Phase 3 — TV command-bridge design. The map remains the primary focus. */
#rail .rail-heading{display:flex;justify-content:space-between;align-items:center;padding:.1rem .3rem;color:#a6d9f3;font:800 .64rem Orbitron,Inter,sans-serif;letter-spacing:.11em}#rail .rail-heading small{font:700 .52rem Inter,sans-serif;letter-spacing:.04em;color:#86bacf}
#app{grid-template-columns:clamp(200px,17vw,298px) minmax(0,1fr) clamp(240px,20vw,350px)}
#top{min-height:62px;gap:clamp(.5rem,1vw,1.3rem);padding:.45rem 1rem;position:relative;z-index:3}
#top::after{content:"";position:absolute;bottom:-1px;left:21%;right:21%;height:1px;background:linear-gradient(90deg,transparent,#4be2ff,transparent);opacity:.6}
#top .era{font-size:clamp(.7rem,.95vw,1rem);white-space:nowrap}
#top .round{font-size:.8rem;white-space:nowrap}
#top .storm{font-size:.78rem;min-width:0}
#top .storm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .phase{font-size:.85rem;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
#top .timer{font-size:1.4rem;color:#8beaff}
#map{background:radial-gradient(ellipse at 48% 44%,rgba(29,80,143,.17),transparent 62%);overflow:hidden}
#rail{padding:.48rem;gap:.3rem;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(85,188,229,.36) transparent}
#rail .house{grid-template-columns:auto minmax(0,1fr) auto;gap:.42rem;padding:.35rem .36rem;min-height:3.55rem;border-radius:.55rem}
#rail .house .av{--s:42px!important;width:42px!important;height:42px!important}
#rail .house .nm{font-size:clamp(.72rem,.88vw,.86rem)}
#rail .house .inf{font-size:1.25rem}
#rail .house .meta{font-size:.7rem;gap:.33rem}
#rail .house .st{font-size:.68rem}
#rail .house.first::before{display:none}#rail .house.first{border-top-color:#4be2ff;box-shadow:inset 0 2px 0 rgba(75,226,255,.32)}
#side{padding:.5rem;gap:.36rem;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(85,188,229,.36) transparent}
#side h3{font-family:Orbitron,Inter,sans-serif;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:#a8d5ec;margin:.15rem 0}
#side .draft-head{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
#side .pool-count{font-size:.66rem;letter-spacing:.04em;color:#81dfff;font-weight:800}
#side .pool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:.38rem}
#side .pool-grid .card{min-width:0;min-height:4.05rem;padding:.45rem .43rem .36rem;border-left:2px solid #55cdea}
#side .pool-grid .card b{font-size:clamp(.66rem,.79vw,.8rem);line-height:1.15;padding-right:0;overflow-wrap:anywhere}
#side .pool-grid .card p{font-size:.64rem;line-height:1.25;margin-top:.35rem;overflow-wrap:anywhere}
#side .pool-grid .card .tag{position:static;display:block;text-transform:uppercase;letter-spacing:.06em;font-size:.54rem;margin-bottom:.2rem}
#side .trophy-stack{display:grid;gap:.35rem;margin-top:auto}
#side .trophy-stack .card{padding:.4rem .48rem}
#side .trophy-stack .trophy{font-size:.73rem}
#side .trophy-stack small{font-size:.6rem}
#side .trophy-stack .av{width:30px!important;height:30px!important}
#tick{min-height:3.15rem;gap:1rem;padding:.45rem 1rem}
#tick .prev{margin-right:6rem;max-width:38%}
#mapLegend{position:absolute;left:1rem;bottom:.9rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;max-width:calc(100% - 2rem);padding:.4rem .6rem;border:1px solid rgba(91,175,218,.33);border-radius:.6rem;background:rgba(2,13,31,.78);backdrop-filter:blur(8px);pointer-events:none;color:#d7eeff;font-size:clamp(.57rem,.72vw,.73rem);font-weight:700;box-shadow:0 10px 22px rgba(0,0,0,.22)}
#mapLegend .dot{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:3px;flex:none}
#mapLegend .dot.owned{border:2px solid #5ce4ff;transform:rotate(45deg)}
#mapLegend .dot.lane{height:2px;background:#70dfff;box-shadow:0 0 6px #5ceaff}
#mapLegend .dot.storm{background:repeating-linear-gradient(135deg,#ff8e53 0 3px,transparent 3px 6px);border:1px solid #ff8e53}
#mapLegend .dot.next{border:2px dashed #ffaf7e}
#banner{top:.7rem;pointer-events:none;font-size:.8rem;padding:.5rem .9rem;line-height:1.3}
@media(max-height:850px){#rail{gap:.17rem}#rail .house{min-height:3.15rem;padding:.22rem .28rem}#rail .house .av{width:36px!important;height:36px!important}#side .pool-grid .card{min-height:3.4rem;padding:.3rem}#side .pool-grid .card p{font-size:.59rem}#mapLegend{bottom:.35rem}}
@media(max-width:1050px){#app{grid-template-columns:190px minmax(0,1fr) 225px}#top{gap:.5rem}#top .storm{max-width:9rem}#tick .prev{display:none}#mapLegend{font-size:.61rem;gap:.3rem}}
@media(max-width:740px){#app{grid-template-columns:145px minmax(0,1fr) 164px}#top .round{display:none}#top .storm{display:none}#rail .house .meta{display:none}#rail .house .inf{font-size:1rem}#rail .house .av{width:30px!important;height:30px!important}#side .pool-grid{grid-template-columns:1fr}#side .pool-grid .card p{display:none}#mapLegend{display:none}}
@media(prefers-reduced-motion:reduce){#top::after{display:none}}

/* Phase 5: cinematic event presentation, audio controls and motion-safe alternatives */
#cinematic{position:absolute;z-index:8;top:clamp(4rem,12%,7rem);left:50%;transform:translateX(-50%);width:min(82%,37rem);pointer-events:none;text-align:center;display:none;padding:.75rem 1.2rem 1rem;background:linear-gradient(110deg,rgba(7,16,37,.94),rgba(17,40,68,.92),rgba(7,16,37,.94));border-top:1px solid rgba(122,227,255,.65);border-bottom:1px solid rgba(122,227,255,.65);box-shadow:0 15px 50px rgba(0,0,0,.55),0 0 42px rgba(25,172,230,.12)}
#cinematic.show{display:block;animation:cinematicIn .42s cubic-bezier(.2,.9,.2,1) both}
#cinematic .eyebrow{font:800 .65rem Orbitron,Inter,sans-serif;letter-spacing:.25em;color:#93dfff}
#cinematic .headline{font:900 clamp(1rem,2.4vw,2.1rem) Orbitron,Inter,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 0 22px rgba(96,208,255,.6);margin:.28rem 0}
#cinematic .detail{font:650 clamp(.67rem,.98vw,.85rem) Inter,sans-serif;letter-spacing:.05em;color:#d4effb}
#cinematic.urgent{border-color:#ffb474;box-shadow:0 15px 52px rgba(0,0,0,.55),0 0 42px rgba(250,103,49,.18)}
#cinematic.urgent .eyebrow{color:#ffb474}
#map.phase5-battle:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,184,119,.24),transparent 55%);animation:battleFlash 1.25s ease-out both;z-index:4}
#soundRack{position:fixed;right:.8rem;bottom:.5rem;z-index:40;display:flex;align-items:center;gap:.55rem;border:1px solid rgba(109,201,245,.35);border-radius:2rem;background:rgba(5,20,38,.94);padding:.25rem .7rem;box-shadow:0 8px 30px rgba(0,0,0,.38)}
#sound{position:static;inset:auto;right:auto;bottom:auto;min-width:7.1rem;font-size:.75rem;border:none;box-shadow:none;background:transparent;color:#ccefff;text-align:left;cursor:pointer}
#volume{width:5rem;accent-color:#4fdfff;cursor:pointer}#soundRack label{font-size:.67rem;color:#a8d7e8}
#tick{padding-right:17rem}#tick .prev{margin-right:0;max-width:38%}
#sound:focus-visible,#volume:focus-visible{outline:2px solid #b1edff;outline-offset:2px}
@keyframes cinematicIn{from{opacity:0;transform:translate(-50%,-15px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes battleFlash{0%{opacity:.9}60%{opacity:.17}100%{opacity:0}}
@media (max-width:950px){#cinematic{width:min(95%,32rem);padding:.4rem .8rem}#soundRack{bottom:.24rem;right:.4rem}#volume{width:3.5rem}}
@media (prefers-reduced-motion:reduce){#cinematic.show{animation:none}#map.phase5-battle:after{display:none}}
</style>
</head>
<body>
<div id="conn" role="status">Reconnecting to the game server…</div>
<section id="lobby" aria-label="Lobby">
  <canvas class="bg" id="lobbyBg"></canvas>
  <div>
    <div class="brand-kicker"><span class="signal"></span> A GALAXY OF RIVAL HOUSES</div>
    <img class="lobby-logo" src="art/brand/starfall-logo.png" alt="STARFALL LANES">
    <h1 class="visually-hidden">Starfall Lanes</h1>
    <p class="sub">Claim worlds, open hyperlanes, outrun the Solar Storm. First to Influence <span id="lTarget">15</span> becomes Warden of the Cluster.</p>
    <div class="join">
      <canvas id="qr" width="264" height="264" aria-label="QR code to join"></canvas>
      <div>
        <div class="lbl">Scan to join, or open</div>
        <div class="url" id="url"></div>
        <div class="lbl" style="margin-top:.8rem">and enter code</div>
        <div class="code" id="code">····</div>
      </div>
    </div>
    <div class="lobbyMode" id="lMode"></div>
  </div>
  <div>
    <div class="roster" id="roster"></div>
    <p class="sub" id="lHint" style="margin-top:1rem"></p>
  </div>
</section>
<div id="app" hidden>
  <header id="top">
    <img class="top-logo" src="art/brand/starfall-mark.svg" alt="Starfall Lanes">
    <span class="era" id="tEra"></span><span class="round" id="tRound"></span>
    <span class="storm" id="tStorm"><i></i><span></span></span>
    <span class="phase"><span id="tPhase"></span><span class="timer" id="tTimer"></span></span>
  </header>
  <aside id="rail" aria-label="Houses"></aside>
  <main id="map">
    <canvas id="cv"></canvas>
    <div id="mapLegend" aria-label="Map key"><span><i class="dot owned"></i>Controlled</span><span><i class="dot lane"></i>Hyperlane</span><span><i class="dot storm"></i>Solar Storm</span><span><i class="dot next"></i>Next storm position</span></div>
    <div id="banner"></div>
    <div id="cinematic" role="status" aria-live="polite" aria-atomic="true"><div class="eyebrow" id="cinematicEyebrow"></div><div class="headline" id="cinematicHeadline"></div><div class="detail" id="cinematicDetail"></div></div>
    <div id="popup"></div>
    <div class="big" id="big"><div class="inner" id="bigInner"></div></div>
  </main>
  <aside id="side" aria-label="Draft pool and trophies"></aside>
  <footer id="tick"><span class="now" id="tNow"></span><span class="prev" id="tPrev"></span></footer>
</div>
<div id="soundRack"><button id="sound" type="button" aria-pressed="false">Sound off</button><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" step="5" value="40" aria-label="Game sound volume"></div>
<script>
/*QRJS*/
</script>
<script>
/*COMMONJS*/
/*MAPJS*/

// ───────── Phase 5: locally bundled cinematic audio ─────────
// All audio starts muted and requires an explicit user gesture. No CDN / external requests.
const Snd = {
  ctx: null, output: null, ambience: null, on: false, buffers: {}, loading: null,
  volume: .4,
  tracks: ['ambient-orbit','solar-storm','hyperlane-open','spire-build','fleet-move','fleet-clash','era-transition','victory','credits'],
  getContext() {
    if (!this.ctx) {
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioClass) return null;
      this.ctx = new AudioClass();
      const limiter = this.ctx.createDynamicsCompressor();
      limiter.threshold.value=-18;limiter.knee.value=14;limiter.ratio.value=4;
      limiter.attack.value=.006;limiter.release.value=.22;
      const gain = this.ctx.createGain();gain.gain.value=0;
      gain.connect(limiter);limiter.connect(this.ctx.destination);this.output=gain;
    }
    return this.ctx;
  },
  async load() {
    if (this.loading) return this.loading;
    const c=this.getContext();if(!c)return;
    this.loading = Promise.all(this.tracks.map(async k=>{
      try {
        const res=await fetch('audio/'+k+'.mp3',{cache:'force-cache'});
        if (!res.ok) throw new Error('Audio '+res.status);
        const b=await res.arrayBuffer();
        this.buffers[k]=await c.decodeAudioData(b);
      } catch (e) { console.warn('Optional game sound unavailable:',k); }
    })).then(()=>{if(this.on)this.startAmbience();});
    return this.loading;
  },
  enable() {
    const c=this.getContext();if(!c){updSound();return;}
    this.on=true;c.resume();
    this.output.gain.setTargetAtTime(this.volume,c.currentTime,.08);
    this.load();this.startAmbience();updSound();
  },
  toggle() {
    if(!this.on){this.enable();return;}
    this.on=false;
    if(this.ctx){this.output.gain.setTargetAtTime(.0001,this.ctx.currentTime,.045);}
    this.stopAmbience();updSound();
  },
  setVolume(v) {
    const parsed=Number(v);
    this.volume=Math.max(0,Math.min(1,Number.isFinite(parsed)?parsed/100:.4));
    try { localStorage.setItem('sf_tv_volume',String(Math.round(this.volume*100))); }catch(_){}
    if(this.ctx&&this.on)this.output.gain.setTargetAtTime(this.volume,this.ctx.currentTime,.05);
  },
  play(k,gain=1) {
    if(!this.on||!this.ctx||!this.buffers[k])return false;
    const c=this.ctx,src=c.createBufferSource(),g=c.createGain();
    src.buffer=this.buffers[k];g.gain.value=Math.min(.85,Math.max(.02,gain*.55));
    src.connect(g).connect(this.output);src.start();return true;
  },
  startAmbience() {
    if(!this.on||this.ambience||!this.buffers['ambient-orbit']||!this.ctx)return;
    const c=this.ctx,src=c.createBufferSource(),gain=c.createGain();
    src.buffer=this.buffers['ambient-orbit'];src.loop=true;
    gain.gain.value=.11;src.connect(gain).connect(this.output);src.start();
    this.ambience={src,gain};
  },
  stopAmbience() {
    if (!this.ambience) return;
    const a=this.ambience;this.ambience=null;
    try{a.src.stop();a.src.disconnect();a.gain.disconnect();}catch(_){}
  },
  // Quiet oscillator fallback for countdown and when an optional sample is missing.
  tone(f,d=.08,type='sine',v=.065,f2=null,delay=0) {
    if(!this.on||!this.ctx)return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+d+.03);
    o.connect(g).connect(this.output);o.start(t);o.stop(t+d+.05);
  },
  chime(){if(!this.play('credits'))this.tone(880,.2,'sine',.07);},
  whoosh(){if(!this.play('hyperlane-open'))this.tone(240,.4,'triangle',.06,940);},
  beam(){if(!this.play('spire-build'))this.tone(180,.36,'triangle',.06,660);},
  zap(){if(!this.play('fleet-clash'))this.tone(1300,.35,'sawtooth',.06,180);},
  fanfare(){if(!this.play('era-transition'))[523,659,784].forEach((f,i)=>this.tone(f,.28,'triangle',.05,null,i*.13));},
  victory(){if(!this.play('victory'))this.fanfare();},
  tick(){this.tone(940,.05,'sine',.027);},
  low(){if(!this.play('solar-storm'))this.tone(150,.35,'triangle',.05,65);}
};
const soundBtn=document.getElementById('sound');
const volumeControl=document.getElementById('volume');
try { const raw=localStorage.getItem('sf_tv_volume');if(raw!==null){const saved=Number(raw);if(Number.isFinite(saved)&&saved>=0&&saved<=100)volumeControl.value=String(saved);} }catch(_){}
Snd.setVolume(volumeControl.value);
volumeControl.oninput=()=>Snd.setVolume(volumeControl.value);
function updSound(){soundBtn.textContent=Snd.on?'Sound on · M to mute':'Sound off · Enable';soundBtn.setAttribute('aria-pressed',String(Snd.on));}
soundBtn.onclick=()=>Snd.toggle();
addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))Snd.toggle();});

// ───────── State ─────────
let C = null, pub = null, now = () => Date.now(), lastFx = 0, roomCode = null, lastLogLen = '';
const $ = id => document.getElementById(id);
const map = MapView($('cv'), { theme: 'dark', cinematic: true, padTop: 64, padBottom: 12 });
const lobbyMap = MapView($('lobbyBg'), { theme: 'dark' });
const conn = Conn(onMsg, send => {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('sf_tv') || 'null'); } catch (e) { }
  if (saved && saved.room) send({ t: 'tvJoin', room: saved.room }); else send({ t: 'tvCreate' });
}, ok => $('conn').classList.toggle('show', !ok));

function onMsg(m) {
  if (m.t === 'welcome') {
    C = m.consts; roomCode = m.room;
    try { localStorage.setItem('sf_tv', JSON.stringify({ room: m.room, tvToken: m.tvToken })); } catch (e) { }
    setJoinInfo(m.room);
  }
  if (m.t === 'state') { pub = m.pub; now = clockFrom(pub); render(); }
}
async function setJoinInfo(code) {
  $('code').textContent = code;
  let origin = location.origin;
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    try { const r = await fetch('/info'); const j = await r.json(); if (j.ips && j.ips[0]) origin = `${location.protocol}//${j.ips[0]}:${location.port || j.port}`; } catch (e) { }
  }
  const url = `${origin}/phone.html?room=${code}`;
  $('url').textContent = origin.replace(/^https?:\/\//, '') + '/phone.html';
  drawQR(url);
}
function drawQR(text) {
  const cv = $('qr'), ctx = cv.getContext('2d');
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 2, cell = Math.floor(cv.width / (n + m * 2)), off = Math.floor((cv.width - cell * n) / 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
}

// The cue is deliberately visual and nonblocking: all game controls still work.
let cueTimer=null, lastScene=null, lastRoundPhase=null, lastWinScene=false;
function scene(kicker,title,detail='',urgent=false,duration=2500) {
  const el=$('cinematic');
  $('cinematicEyebrow').textContent=kicker;
  $('cinematicHeadline').textContent=title;
  $('cinematicDetail').textContent=detail;
  el.classList.toggle('urgent',urgent);el.classList.remove('show');
  void el.offsetWidth;el.classList.add('show');
  clearTimeout(cueTimer);cueTimer=setTimeout(()=>el.classList.remove('show'),duration);
}
function sceneForPhase(g){
  const key=`${g.round}:${g.phase}`;if(key===lastRoundPhase)return;
  lastRoundPhase=key;
  if(g.phase==='era'){
    const era=C.ERA_NAMES[g.era];
    scene('CHAPTER '+(g.era+1),era.toUpperCase()+' ERA','New technologies are available · choose your upgrade',false,3200);
    Snd.fanfare();
  } else if(g.phase==='income'&&g.round>0){
    scene('GALACTIC WEATHER','SOLAR STORM ADVANCES','Watch the marked sectors and next-round forecast',true,2200);
    map.addFx({k:'storm'});Snd.low();
  } else if(g.phase==='over'&&!lastWinScene){
    lastWinScene=true;Snd.victory();
  }
}
// ───────── Render ─────────
const AV = p => C.AVATARS[p.avatar];
const P = id => pub.players.find(p => p.id === id);
function render() {
  if (!C || !pub) return;
  const inGame = pub.phase === 'game' && pub.game;
  $('lobby').classList.toggle('show', !inGame);
  $('app').hidden = !inGame;
  if (!inGame) { lastRoundPhase=null;lastWinScene=false;$('cinematic').classList.remove('show');return renderLobby(); }
  const g = pub.game;
  map.setState(pub, C.AVATARS);
  if (g.fx && g.fx.seq !== lastFx) { const first = lastFx === 0; lastFx = g.fx.seq; if (!first) onFx(g.fx); }
  sceneForPhase(g);
  renderTop(g); renderRail(g); renderSide(g); renderTick(g); renderBanner(g); renderBig(g);
}
function renderLobby() {
  lobbyMap.setState({ players: [], game: null });
  const mode = C.MODES[pub.mode];
  $('lTarget').textContent = mode.target;
  $('lMode').innerHTML = `Mode: <span>${mode.name}</span> — ${mode.rounds} rounds, first to ${mode.target} Influence${mode.events ? ', Cosmic Events and house perks on' : ''}`;
  const slots = [];
  for (let i = 0; i < 8; i++) {
    const p = pub.players[i];
    if (!p) { slots.push(`<div class="slot empty">Open seat</div>`); continue; }
    const av = AV(p);
    slots.push(`<div class="slot">${avatarHTML(av, { size: 56, off: !p.connected })}<div><b>${esc(p.name)}${p.id === pub.hostId ? ' ★' : ''}</b><small>${esc(av.name)}${p.bot ? ' · bot' : ''}</small></div></div>`);
  }
  $('roster').innerHTML = slots.join('');
  $('lHint').textContent = pub.players.length < 2 ? 'Waiting for at least 2 players.' : 'The host (★) starts the game from their phone.';
}
function renderTop(g) {
  $('tEra').textContent = `Era: ${C.ERA_NAMES[g.era]}`;
  $('tRound').textContent = g.round ? `Round ${g.round} of ${g.maxRounds}` : 'Setting up';
  $('tStorm').querySelector('span').textContent = `Storm heading ${g.stormDir}`;
  const names = { missions: 'Choose Missions', setup: 'Landing', era: 'New era', income: 'Storm & income', plan: 'Plan your moves', reveal: 'Reveal', over: 'Game over' };
  $('tPhase').textContent = names[g.phase] || '';
}
setInterval(() => {
  if (!pub || !pub.game) return;
  const g = pub.game, left = g.phaseEnds ? g.phaseEnds - now() : 0;
  const el = $('tTimer');
  el.textContent = g.phaseEnds ? fmtTime(left) : '';
  el.classList.toggle('low', g.phaseEnds && left < 10500);
  if (g.phase === 'plan' && g.phaseEnds && left < 10500 && left > 0 && Math.ceil(left / 1000) !== renderTick.last) { renderTick.last = Math.ceil(left / 1000); Snd.tick(); }
}, 250);
function renderRail(g) {
  const order = g.order.length ? g.order : pub.players.map(p => p.id);
  $('rail').innerHTML = '<div class="rail-heading">HOUSES <small>TURN ORDER</small></div>' + order.map((id, i) => {
    const p = P(id); if (!p) return '';
    const av = AV(p);
    let st = '';
    if (!p.connected) st = '<div class="st off">Disconnected</div>';
    else if (g.phase === 'plan') st = p.engaged || p.isAI ? '<div class="st ok">✔ Ready</div>' : '<div class="st wait">Planning…</div>';
    else if (g.phase === 'missions') st = p.keepDone ? '<div class="st ok">✔ Ready</div>' : '<div class="st wait">Choosing…</div>';
    else if (g.phase === 'era') st = p.eraPicked || p.isAI ? '<div class="st ok">✔ Picked</div>' : '<div class="st wait">Choosing…</div>';
    let gainH = '';
    if (g.phase === 'income' && g.income && g.income[id]) {
      const gi = g.income[id];
      gainH = '<div class="gain">' + C.RES.filter(k => gi[k]).map(k => `<span class="res-${k}">${gi[k] > 0 ? '+' : ''}${gi[k]}${ricon(k)}</span>`).join('') + '</div>';
    }
    return `<div class="house${i === 0 && g.round ? ' first' : ''}${g.setupTurn === id ? ' turn' : ''}">
      ${avatarHTML(av, { size: 46, mood: p.mood, era: g.era, off: !p.connected })}
      <div style="min-width:0"><div class="nm">${esc(p.name)}</div>
        <div class="meta"><span title="Sectors">⬡ ${p.sectors}</span><span title="Fleets">➤ ${p.fleets}</span><span title="Hyperlanes">⇄ ${p.lanes}</span></div>${st}${gainH}</div>
      <div class="inf">${p.inf}<small>of ${g.target}</small></div></div>`;
  }).join('');
}
function renderSide(g) {
  const parts = [];
  if (g.event) parts.push(`<div class="card event"><span class="tag">Cosmic Event</span><b>${esc(C.EVENTS[g.event].name)}</b><p>${esc(C.EVENTS[g.event].text)}</p></div>`);
  const showingPool = g.phase === 'plan' || (g.phase === 'reveal' && g.pool.length);
  parts.push(`<div class="draft-head"><h3>Draft pool</h3><span class="pool-count">${showingPool ? g.pool.length + ' available' : 'Next round'}</span></div>`);
  if (showingPool && g.pool.length) {
    parts.push('<div class="pool-grid">');
    for (const [i,c] of g.pool.entries()) {
      const d = C.DRAFT[c.key];
      parts.push(`<div class="card" data-uid="${c.uid}" title="${esc(d.name)} — ${esc(d.text)}"><span class="tag">${i + 1} · ${esc(d.type)}</span><b>${esc(d.name)}</b><p>${esc(d.text)}</p></div>`);
    }
    parts.push('</div>');
  } else {
    parts.push(`<div class="card"><p>${showingPool ? 'No draft this round.' : 'New cards arrive when planning starts. Rank them on your phone; picks resolve in turn order.'}</p></div>`);
  }
  const tr = (k, label, rule) => { const h = g.trophies[k] && P(g.trophies[k]); return `<div class="card trophy"><span>🏆 ${label}<br><small style="color:var(--muted);font-weight:600">${rule}</small></span><span class="who">${h ? avatarHTML(AV(h), { size: 30 }) : '—'}</span></div>`; };
  parts.push('<div class="trophy-stack"><h3>Trophies (+2 each)</h3>');
  parts.push(tr('network', 'Longest Network', 'Longest chain · 5+ segments'));
  parts.push(tr('armada', 'Grand Armada', 'Largest fleet · 5+ ships'));
  parts.push('</div>');
  $('side').innerHTML = parts.join('');
}
function renderTick(g) {
  const L = g.log;
  $('tNow').textContent = L[L.length - 1] || 'Welcome to the Starfall Cluster.';
  $('tPrev').textContent = L.length > 1 ? L[L.length - 2] : '';
}
function renderBanner(g) {
  let h = '';
  if (g.phase === 'missions') h = 'Everyone: choose your secret Missions on your phone';
  if (g.phase === 'setup' && g.setupTurn) { const p = P(g.setupTurn); h = `${avatarHTML(AV(p), { size: 34 })}<span>${esc(p.name)} is choosing a landing site</span>`; }
  if (g.phase === 'plan') h = 'Plan in secret on your phones, then tap Engage';
  if (g.phase === 'reveal') h = 'Reveal';
  if (g.phase === 'income') h = g.event ? `Cosmic Event: ${esc(C.EVENTS[g.event].name)}` : 'The storm moves. Income arrives.';
  $('banner').innerHTML = h;
}
function renderBig(g) {
  const big = $('big'), inner = $('bigInner');
  if (g.phase === 'era' && g.eraOffer.length) {
    big.classList.add('show');
    inner.innerHTML = `<h2>The ${C.ERA_NAMES[g.era]} era</h2><p>Each house picks one upgrade on their phone.</p><div class="ups">${g.eraOffer.map(k => `<div class="card"><b>${esc(C.UPGRADES[k].name)}</b><p>${esc(C.UPGRADES[k].text)}</p></div>`).join('')}</div>`;
  } else if (g.phase === 'over' && g.results) {
    big.classList.add('show');
    const w = g.results.winners.map(P);
    const rows = g.results.rows.map(r => { const p = P(r.pid); return `<tr class="${g.results.winners.includes(r.pid) ? 'win' : ''}"><td>${avatarHTML(AV(p), { size: 34, mood: p.mood, era: g.era })}</td><td>${esc(p.name)}</td><td class="n">${r.final}</td><td>${r.penalty ? `${r.inf} − ${r.penalty} unfinished` : ''}</td><td>${r.credits}${ricon('credits')}</td></tr>`; }).join('');
    inner.innerHTML = `<div class="over"><div style="display:flex;gap:1rem;justify-content:center;margin-bottom:1rem">${w.map(p => avatarHTML(AV(p), { size: 120, mood: 'smug', era: 2 })).join('')}</div>
      <h2>${w.length > 1 ? 'Shared victory!' : esc(w[0].name) + ' wins!'}</h2><p>${w.length > 1 ? 'Joint Wardens of the Cluster.' : 'Warden of the Starfall Cluster.'}</p>
      <table><tr><th></th><th>House</th><th>Influence</th><th></th><th>Credits</th></tr>${rows}</table>
      <p style="margin-top:1rem;font-size:.85rem">The host can start a new game from their phone.</p></div>`;
  } else big.classList.remove('show');
}

// ───────── Effects ─────────
let popTimer = null;
function popup(html, dur) { const el = $('popup'); el.innerHTML = html; el.classList.add('show'); clearTimeout(popTimer); popTimer = setTimeout(() => el.classList.remove('show'), dur || 2200); }
function onFx(f) {
  map.addFx(f);
  const g = pub.game;
  if (f.k === 'found') { Snd.beam(); scene('NEW COLONY','OUTPOST FOUNDED','A new world joins a rival house'); }
  if (f.k === 'spire') { Snd.beam(); scene('COLONY EXPANSION','SPIRE CONSTRUCTED','Your empire grows upwards',false,2000); }
  if (f.k === 'lane') { Snd.whoosh(); scene('HYPERSPACE NETWORK','HYPERLANE OPENED','Trade routes are now operational',false,1900); }
  if (f.k === 'fleet' || f.k === 'move') { if(!Snd.play('fleet-move'))Snd.tone(500,.2,'triangle',.08,900); }
  if (f.k === 'income') Snd.chime();
  if (f.k === 'storm') { Snd.low(); scene('SOLAR ANOMALY','STORM SURGE','The solar front is changing',true); }
  if (f.k === 'fail') Snd.low();
  if (f.k === 'era') { /* phase transition will play its own single cue */ }
  if (f.k === 'over') {lastWinScene=true;Snd.victory();}
  if (f.k === 'draft') {
    Snd.tone(700, .15, 'sine', .1, 1000);
    const p = P(f.pid), d = C.DRAFT[f.key];
    popup(`<div class="clash">${avatarHTML(AV(p), { size: 44, era: g.era })}<div><b>${esc(p.name)}</b> drafts <b>${esc(d.name)}</b><div class="bd">${esc(d.text)}</div></div></div>`, 1000);
  }
  if (f.k === 'mission' || f.k === 'trophy') {
    Snd.fanfare();
    const p = P(f.pid);
    const txt = f.k === 'mission' ? `Mission complete: ${esc(f.text)} (+${f.inf})` : `Takes ${f.key === 'network' ? 'Longest Network' : 'Grand Armada'} (+2)`;
    popup(`<div class="clash">${avatarHTML(AV(p), { size: 56, mood: 'smug', era: g.era })}<div><b>${esc(p.name)}</b><div>${txt}</div></div></div>`, 1500);
  }
  if (f.k === 'clash') {
    Snd.zap();
    $('map').classList.remove('phase5-battle');void $('map').offsetWidth;$('map').classList.add('phase5-battle');
    setTimeout(()=>$('map').classList.remove('phase5-battle'),1400);
    const a = P(f.pid), d = P(f.did);
    const side = (p, fleets, bonus, die, sum, win) => `<div class="side${win ? ' win' : ''}">${avatarHTML(AV(p), { size: 48, era: g.era })}<div style="font-weight:800;margin-top:.3rem">${esc(p.name)}</div><div class="sum">${sum}</div><div class="bd">${fleets} Fleets${bonus ? ` + ${bonus} bonus` : ''} + <span class="die">${die}</span></div></div>`;
    popup(`<div class="clash">${side(a, f.atkF, f.atkB, f.ad, f.A, f.win)}<div class="vs">VS</div>${side(d, f.defF, f.defB, f.dd, f.D, !f.win)}</div>`, 2100);
  }
}

// ───────── Loop ─────────
function frame(t) {
  if (pub && pub.phase === 'game') map.draw(t); else lobbyMap.draw(t);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { map.resize(); lobbyMap.resize(); });
requestAnimationFrame(() => { map.resize(); lobbyMap.resize(); requestAnimationFrame(frame); });
new ResizeObserver(() => map.resize()).observe($('map'));
</script>
</body>
</html>

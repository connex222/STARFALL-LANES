<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A16">
<title>Starfall Lanes</title>
<link rel="icon" type="image/svg+xml" href="art/brand/starfall-mark.svg">
<style>
/*CSS*/
html{font-size:16px}
body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
#wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:.5rem .75rem;display:flex;align-items:center;gap:.6rem;backdrop-filter:blur(8px)}
#top .who{min-width:0;flex:1}
#top .who b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .who small{color:var(--muted);font-size:.78rem;font-weight:600}
#top .inf{font-family:Inter;font-weight:800;font-size:1.35rem;text-align:right;line-height:1}
#top .inf small{display:block;font-family:Inter;font-size:.62rem;color:var(--muted);font-weight:700}
#top .tm{font-family:Inter;font-weight:800;font-size:1.05rem;min-width:3.6ch;text-align:right;font-variant-numeric:tabular-nums}
#top .tm.low{color:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;font-weight:900;background:var(--panel2);border:1px solid var(--line)}
#resbar{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;padding:.45rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:4}
#resbar .r{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:1.15rem;line-height:1.1}
#resbar .r small{font-size:.6rem;font-weight:700;color:var(--muted)}
#head,#body{padding:.75rem}
#head:empty,#body:empty{display:none}
#mapBox{position:relative;margin:0 .75rem;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:none;touch-action:manipulation}
#mapBox.show{display:block}
#mapBox canvas{width:100%;height:100%;display:block}
#foot{position:sticky;bottom:0;padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5;display:flex;gap:.5rem;margin-top:auto}
#foot:empty{display:none}
h2{font-size:1.15rem;font-weight:900;margin-bottom:.35rem}
p.lead{color:var(--muted);font-size:.92rem;line-height:1.4;margin-bottom:.7rem}
.btn{min-height:52px;border-radius:14px;padding:.7rem 1rem;font-weight:800;font-size:1rem;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;flex:1}
.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;font-size:.9rem;flex:none;padding:.5rem .8rem}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:1.1rem;padding:.6rem .9rem}
input.code{font-family:Orbitron;font-weight:900;letter-spacing:.3em;text-transform:uppercase;font-size:1.6rem;text-align:center}
label.f{display:block;font-weight:800;font-size:.85rem;margin:.9rem 0 .35rem}
.err{color:var(--bad);font-weight:700;margin-top:.7rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.house{display:flex;gap:.6rem;align-items:center;text-align:left;padding:.6rem;border-radius:14px;background:var(--panel);border:2px solid var(--line);min-height:68px}
.house.mine{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.house:disabled{opacity:.5}
.house b{display:block;font-size:.88rem;line-height:1.2}
.house small{display:block;color:var(--muted);font-size:.72rem;margin-top:.1rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.seg button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:.9rem;padding:.3rem}
.seg button small{display:block;font-weight:600;font-size:.68rem;color:var(--muted)}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--panel))}
.list{display:flex;flex-direction:column;gap:.45rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.55rem .6rem;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:.92rem}
.row small{display:block;color:var(--muted);font-size:.75rem}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.7rem .8rem;position:relative}
.card b{display:block;font-size:.98rem}
.card p{font-size:.84rem;color:var(--muted);margin-top:.2rem;line-height:1.35}
.card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.card.off{opacity:.5;text-decoration:line-through}
.card .tag{position:absolute;right:.6rem;top:.55rem;font-size:.7rem;font-weight:800;color:var(--accent)}
.card.done{border-color:var(--good)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:.25rem;padding:.4rem .75rem 0}
.tabs button{min-height:46px;border-radius:12px 12px 0 0;font-weight:800;font-size:.8rem;background:var(--panel2);border:1px solid var(--line);border-bottom:0;position:relative}
.tabs button.on{background:var(--accent);color:var(--accentText)}
.tabs .dot{position:absolute;top:4px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
.slot{display:flex;align-items:center;gap:.5rem;min-height:64px;border-radius:14px;border:2px dashed var(--line);padding:.55rem .7rem;width:100%;text-align:left;background:transparent}
.slot.filled{border-style:solid;background:var(--panel)}
.slot.editing{border-color:var(--accent)}
.slot .n{font-family:Inter;font-weight:800;font-size:1.1rem;color:var(--muted);width:1.4rem}
.slot .grow{flex:1;min-width:0}
.slot b{display:block;font-size:.95rem}
.slot small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.7rem}
.cmd{min-height:74px;border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:.5rem .6rem;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.cmd b{font-size:.95rem}
.cmd .costs{display:flex;gap:.35rem;flex-wrap:wrap;font-size:.82rem;font-weight:800}
.cmd:disabled{opacity:.4}
.cmd .why{font-size:.7rem;color:var(--muted);font-weight:600}
.cost{display:inline-flex;align-items:center;gap:.15rem;font-weight:800}
.warn{background:color-mix(in srgb,var(--storm) 16%,var(--panel));border:2px solid var(--storm);border-radius:12px;padding:.55rem .7rem;font-size:.85rem;font-weight:700;margin-bottom:.6rem;display:flex;gap:.5rem;align-items:center}
.warn i{flex:none;width:1.1rem;height:1.1rem;border-radius:3px;background:repeating-linear-gradient(135deg,var(--storm) 0 3px,transparent 3px 6px);border:2px solid var(--storm)}
.note{font-size:.82rem;color:var(--muted);margin-top:.5rem;line-height:1.35}
.note.bad{color:var(--bad);font-weight:700}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1.4rem;font-weight:900}
.stepper output{font-family:Inter;font-weight:800;font-size:1.4rem;min-width:2ch;text-align:center}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{min-height:48px;min-width:58px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;padding:0 .55rem}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--panel))}
.modal{position:fixed;inset:0;background:rgba(7,10,22,.7);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:1rem .9rem calc(1rem + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:800;padding:.6rem 1rem;border-radius:12px;z-index:30;display:none;max-width:90%}
.toast.show{display:block}
.conn{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;font-weight:800;text-align:center;padding:.35rem;z-index:40;display:none}
.conn.show{display:block}
.log{font-size:.88rem;line-height:1.4}
.log div{padding:.35rem 0;border-bottom:1px solid var(--line)}
.log div:first-child{font-weight:800;font-size:.98rem}
.ups{display:flex;flex-wrap:wrap;gap:.3rem}
.ups span{font-size:.75rem;font-weight:800;padding:.25rem .5rem;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.rankn{font-family:Inter;font-weight:800;width:1.6rem;text-align:center;color:var(--accent)}
.res-tbl{width:100%;border-collapse:collapse;margin-top:.5rem}
.res-tbl td{padding:.45rem .3rem;border-bottom:1px solid var(--line);font-weight:700}
.res-tbl td.n{text-align:right;font-family:Inter;font-weight:800}
.res-tbl tr.win td{color:var(--gold)}
.mapcap{position:absolute;left:.5rem;bottom:.5rem;right:.5rem;display:flex;gap:.4rem;flex-wrap:wrap;pointer-events:none}
.mapcap span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.2rem .45rem;font-size:.72rem;font-weight:800}
/* Phase 1 + 2: coherent mobile command-console styling */
body{background:radial-gradient(ellipse at 54% 0%,rgba(9,112,174,.12),transparent 33%),var(--bg)}
#top{background:var(--panel);box-shadow:0 5px 25px rgba(0,10,30,.18)}
#wrap{position:relative}
#head{padding-top:1rem}
.phone-brand{text-align:center;position:relative;min-height:175px;margin:1.2rem 0 .8rem;padding:1.1rem .7rem 1rem;border-radius:21px;background:radial-gradient(ellipse at 50% 22%,rgba(38,195,245,.24),transparent 70%),linear-gradient(145deg,#05172c,#0d2842);border:1px solid rgba(82,181,232,.33);box-shadow:0 15px 40px rgba(0,11,25,.22)}
.phone-brand-label{font-size:.63rem;color:#91cae9;font-weight:800;letter-spacing:.16em;margin-bottom:1rem}
.phone-brand img{width:min(100%,380px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 14px rgba(37,198,243,.24))}
.phone-brand .lead{margin:.55rem 0 0;color:#eefaff;font-size:.82rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.btn.primary{background:linear-gradient(125deg,#119bcc,#3ddaff);color:#031623;box-shadow:0 5px 20px rgba(3,170,228,.25);border:1px solid rgba(159,246,255,.68)}
.btn.primary:disabled{box-shadow:none}
.btn,.cmd,.card,.slot,.row,.seg button{box-shadow:inset 0 1px 0 rgba(145,210,244,.06)}
.house{border-color:var(--line)}
.grid2>.house{flex-direction:column;justify-content:center;align-items:center;min-height:167px;text-align:center;gap:.45rem;background:linear-gradient(155deg,var(--panel),var(--panel2));padding:.75rem .45rem}
.grid2>.house .av{box-shadow:0 0 0 3px rgba(28,128,191,.13),0 8px 18px rgba(0,0,0,.26)}
.grid2>.house span{max-width:100%}
.grid2>.house b{font-size:.84rem;max-width:100%;white-space:normal}
.grid2>.house small{font-size:.72rem;line-height:1.35}
.grid2>.house.mine{background:linear-gradient(155deg,var(--panel2),color-mix(in srgb,var(--accent) 15%,var(--panel)))}
#resbar{box-shadow:0 5px 15px rgba(0,0,0,.08)}
.tabs button.on{box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
@media(max-width:340px){.grid2>.house{min-height:155px;padding:.45rem .25rem}.grid2{gap:.35rem}.grid2>.house .av{max-width:74px;max-height:74px}}

/* Phase 3 — personal command console and small-screen accessibility. */
#top{border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
#top .who b{font-size:.95rem;letter-spacing:.01em}
#resbar{gap:.22rem}
#resbar .r{padding:.25rem .1rem;border-radius:.55rem;background:color-mix(in srgb,var(--rc) 9%,transparent);border:1px solid color-mix(in srgb,var(--rc) 35%,transparent)}
#resbar .r span{font-variant-numeric:tabular-nums}
#tabs.tabs{overflow-x:auto;scrollbar-width:none;padding-bottom:.08rem}
#tabs.tabs button{min-width:0;white-space:nowrap;font-size:clamp(.68rem,2.8vw,.82rem)}
#head h2{letter-spacing:.025em}
#head .lead{color:var(--muted)}
#head .cmds{margin-top:.8rem}
#head .cmd{border-radius:15px;border-color:color-mix(in srgb,var(--accent) 19%,var(--line));background:linear-gradient(155deg,var(--panel),var(--panel2));min-height:88px;padding:.65rem .68rem}
#head .cmd:not(:disabled):active,#body button:not(:disabled):active{transform:scale(.985)}
#head .cmd b{color:var(--text);font-weight:800}
#head .cmd .costs{color:var(--muted)}
#head .slot{border-radius:12px;min-height:68px}
#head .slot.filled{border-left:4px solid var(--accent)}
#head .slot .n{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--panel2);color:var(--accent);font-size:.86rem;border:1px solid var(--line)}
#foot{background:linear-gradient(to bottom,transparent,var(--bg) 22%);padding-top:.9rem}
#foot .btn.primary{font-size:1.05rem;font-weight:900;letter-spacing:.01em}
.phase-status{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem .65rem;margin-bottom:.65rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text)}
.phase-status .phase-label{display:block;font-size:.67rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:800;margin-bottom:.1rem}
.phase-status strong{font-size:.89rem}
.phase-status .phase-count{font-size:.8rem;font-weight:800;color:var(--accent);white-space:nowrap}
.phase-status .phase-count.complete{color:var(--good)}
.phase-status .phase-count.waiting{color:var(--muted)}
#foot .engage-hint{flex-basis:100%;width:100%;text-align:center;color:var(--muted);font-size:.7rem;padding-top:.1rem}
#foot:has(.engage-hint){flex-wrap:wrap}
@media(max-width:355px){#top .who small{font-size:.63rem}#top .inf{font-size:1rem}#resbar .r small{font-size:.52rem}#head .cmd{padding:.5rem}#head .cmd b{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){#head .cmd:not(:disabled):active,#body button:not(:disabled):active{transform:none}}
/* Phase 4 — accessible mobile tactics, card ranking, diplomacy and objective progress. */
#pickAssist{margin:.5rem .75rem 0;padding:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:14px}
#pickAssist:empty{display:none}
#pickAssist .pick-kicker{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem;font-size:.78rem;font-weight:800;color:var(--muted)}
#pickAssist .pick-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;max-height:13rem;overflow-y:auto;overscroll-behavior:contain}
#pickAssist .pick-option{min-height:52px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:.45rem .55rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
#pickAssist .pick-option strong{font-size:.82rem;line-height:1.2;overflow-wrap:anywhere}
#pickAssist .pick-option small{font-size:.7rem;color:var(--muted)}
#pickAssist .pick-option.selected{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.pick-instructions{font-size:.78rem;color:var(--muted);margin:.3rem 0 0;line-height:1.35}
.draft-progress{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .65rem;padding:.55rem .7rem;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid var(--line)}
.draft-progress b{font-size:.82rem}.draft-progress span{font-size:.76rem;color:var(--muted)}
.draft-row{display:grid;grid-template-columns:30px minmax(0,1fr) 44px 44px 44px;gap:.2rem;align-items:center;padding:.35rem .3rem;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.draft-row:first-child{border-color:var(--accent)}.draft-row.drop-here{outline:2px solid var(--accent)}
.draft-row.dragging{opacity:.55}.draft-row .rankn{width:30px}
.draft-row .draft-text{min-width:0}.draft-row .draft-text b{font-size:.88rem;display:block;overflow-wrap:anywhere}.draft-row .draft-text small{display:block;font-size:.72rem;line-height:1.3;color:var(--muted)}
.draft-row button{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:800}
.draft-row button:disabled{opacity:.3}.draft-row .rank-handle{touch-action:none;cursor:grab;color:var(--accent);font-size:1.15rem}
.draft-row .rank-handle:active{cursor:grabbing}
.trade-section{padding:.75rem .7rem;margin-bottom:.65rem;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.trade-section h2{margin:0 0 .3rem}.trade-section .lead{margin-bottom:.6rem}
.trade-section .f{margin:.6rem 0 .3rem}.trade-section .list{gap:.25rem}
.trade-section .trade-balance{font-size:.76rem;color:var(--muted);font-weight:800;margin-bottom:.55rem}
.trade-bundle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.trade-bundle{background:var(--panel2);border-radius:12px;padding:.4rem;border:1px solid var(--line);min-width:0}
.trade-bundle .f{margin:.15rem 0 .35rem}.trade-bundle .trade-item{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:.15rem;padding:.35rem .2rem;border-top:1px solid var(--line)}
.trade-item .resource-name{font-size:.75rem;font-weight:800;display:flex;align-items:center;gap:.25rem}
.trade-item .stepper{gap:.15rem;justify-content:space-between}.trade-item .stepper button{width:38px;height:38px;min-height:38px;font-size:1.15rem}
.trade-item .stepper output{font-size:1rem;min-width:1.7ch}.trade-item .stepper button:disabled{opacity:.35}
.trade-summary{font-size:.82rem;margin:.6rem 0 .25rem;padding:.6rem;border:1px solid var(--line);border-radius:10px;background:var(--panel2);line-height:1.4}
.offer-status{font-size:.77rem;font-weight:800;padding:.2rem .5rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);width:fit-content}
.offer-status.accepted{color:var(--good)}.offer-status.failed,.offer-status.declined,.offer-status.expired{color:var(--bad)}
.mission-summary{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .7rem;margin-bottom:.6rem;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:.83rem}
.mission-card{padding-bottom:.65rem}.mission-card .mission-meta{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:.35rem}
.mission-card .progress{height:7px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:.5rem;border:1px solid var(--line)}
.mission-card .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:8px}
button:focus-visible,[draggable]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:355px){.draft-row{grid-template-columns:22px minmax(0,1fr) 40px 40px 40px;gap:.12rem}.draft-row button{width:40px;height:40px}.draft-row .rankn{width:22px}.trade-item .stepper button{width:34px;height:36px;min-height:36px}}
@media(prefers-reduced-motion:reduce){.draft-row,.pick-option{transition:none}}
/* Phase 7: accessible guide links, phone audio and responsive console */
#infoNav{display:flex;align-items:center;gap:.4rem;justify-content:center;flex-wrap:wrap;padding:.45rem .65rem;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:3}
#infoNav a,#phoneSound{font:800 .74rem Inter,sans-serif;color:var(--text);text-decoration:none;min-height:43px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:.4rem .7rem;border:1px solid var(--line);background:var(--panel2)}
#infoNav a:first-child{color:var(--accent)}
#infoNav a:hover,#phoneSound:hover{border-color:var(--accent)}
#phoneSound[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.phone-brand{margin:.7rem 0 .45rem!important;min-height:0!important;padding:.75rem .65rem!important;isolation:isolate;overflow:hidden;border-color:rgba(108,204,255,.52);box-shadow:0 25px 64px rgba(0,0,0,.34),inset 0 0 50px rgba(30,144,205,.09)}
.phone-brand:before{content:"";position:absolute;z-index:-1;inset:-45% 5% auto;aspect-ratio:1;border-radius:50%;border:1px solid rgba(95,209,255,.19);box-shadow:0 0 0 38px rgba(74,164,251,.028),0 0 70px rgba(67,213,255,.16);pointer-events:none}
.phone-brand img{width:min(100%,360px);max-height:182px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(69,215,255,.25))}

<body>
<div class="conn" id="conn" role="status">Reconnecting…</div>
<div id="wrap">
  <div id="top" hidden></div>
  <div id="resbar" hidden></div>
  <div id="tabs" class="tabs" hidden></div>
  <nav id="infoNav" aria-label="Help and sound"><a href="/how-to-play.html" target="_blank" rel="noopener">? How to Play</a><a href="/lore.html" target="_blank" rel="noopener">✦ Lore</a><button type="button" id="phoneSound" aria-pressed="false" aria-label="Enable phone sound effects">♫ Sound off</button><button type="button" id="phoneIntel" hidden aria-pressed="false" aria-controls="head">◎ Galaxy Intel</button></nav><details id="phoneAudioOptions"><summary>Sound settings</summary><div class="sound-row"><label for="phoneVolume">Effect volume</label><input id="phoneVolume" type="range" min="0" max="100" step="5" value="30" aria-label="Phone effect volume"><output id="phoneVolumeValue" for="phoneVolume">30%</output></div></details>
  <div id="head"></div>
  <div id="mapBox"><canvas id="cv" role="img" aria-label="Visual galaxy map. Use the legal sector choices underneath to select, or open Galaxy Intel for a complete readable sector and route register."></canvas><div class="mapcap" id="mapcap"></div></div>
  <div id="pickAssist" aria-label="Legal map choices"></div><div id="quickStatus" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="body"></div>
  <div id="foot"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"><div class="sheet" id="sheet" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/*COMMONJS*/
/*CONNJS*/
/*MAPJS*/

const $ = id => document.getElementById(id);
// Phone sound is always opt-in. The TV supplies ambient audio; the phone plays only quiet local cues.
const PhoneAudio = {
  on:false, volume:.30, lastKey:null, pool:{}, lastPlayed:{},
  sounds:{join:'credits',ready:'credits',trade:'credits',turn:'era-transition',storm:'solar-storm',battle:'fleet-clash',victory:'victory',alert:'solar-storm'},
  init(){
    try {const saved=Number(localStorage.getItem('sf_phone_volume'));if(Number.isFinite(saved)&&saved>=0&&saved<=100)this.volume=saved/100;}catch(_){}
    const s=$('phoneVolume');s.value=String(Math.round(this.volume*100));$('phoneVolumeValue').textContent=s.value+'%';
  },
  setVolume(value){
    const n=Number(value);if(!Number.isFinite(n))return;
    this.volume=Math.max(0,Math.min(1,n/100));
    try{localStorage.setItem('sf_phone_volume',String(Math.round(this.volume*100)));}catch(_){}
    $('phoneVolumeValue').textContent=String(Math.round(this.volume*100))+'%';
    for(const voices of Object.values(this.pool))for(const a of voices)a.volume=this.volume;
  },
  play(type){
    if(!this.on || this.volume===0 || document.visibilityState==='hidden')return;
    const name=this.sounds[type];if(!name)return;
    const tick=performance.now();if(tick-(this.lastPlayed[type]||-1000)<120)return;
    this.lastPlayed[type]=tick;
    try {
      // Reuse two audio channels per sample; bounded memory and simultaneous event support.
      const voices=this.pool[name] || (this.pool[name]=[0,1].map(()=>{const a=new Audio('audio/'+name+'.mp3');a.preload='auto';return a;}));
      const a=voices.find(v=>v.paused||v.ended)||voices[0];
      a.pause();a.currentTime=0;a.volume=this.volume;a.play().catch(()=>{});
    }catch(_){}
  },
  stop(){for(const voices of Object.values(this.pool))for(const a of voices){try{a.pause();a.currentTime=0;}catch(_){}}},
  toggle(){
    this.on=!this.on;const b=$('phoneSound');
    b.textContent=this.on?'♫ Sound on':'♫ Sound off';b.setAttribute('aria-pressed',String(this.on));
    b.setAttribute('aria-label',this.on?'Disable phone sound effects':'Enable phone sound effects');
    if(this.on)this.play('join');else this.stop();
  }
};
PhoneAudio.init();
$('phoneSound').addEventListener('click',()=>PhoneAudio.toggle());
$('phoneVolume').addEventListener('input',e=>PhoneAudio.setVolume(e.target.value));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')PhoneAudio.stop();});
function announce(message){const el=$('quickStatus'); if(el) el.textContent=message;}
let C = null, pub = null, priv = null, now = () => Date.now(), joined = false, joinErr = '', replaced = false;
let ui = { intel: false, intelFilter: 'all', tab: 'console', pick: null, editSlot: null, planRound: -1, plan: null, discard: null, setupSel: null, ex: { give: null, get: null }, offer: { to: null, give: {}, get: {} }, modal: null, lastSeenOffer: null, prevOffersSent: null, offerPending: false };
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const map = MapView($('cv'), { theme: dark() ? 'dark' : 'light', stars: false, quality: 0.9 });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { map.setTheme(dark() ? 'dark' : 'light'); });

// ───────── Connection ─────────
const params = new URLSearchParams(location.search);
const urlRoom = (params.get('room') || '').toUpperCase();
function saved() { try { return JSON.parse(localStorage.getItem('sf_phone') || 'null'); } catch (e) { return null; } }
const conn = Conn(onMsg, send => {
  const s = saved();
  if (s && s.room && (!urlRoom || urlRoom === s.room)) send({ t: 'join', room: s.room, playerId: s.playerId, token: s.token });
  else render();
}, ok => { $('conn').classList.toggle('show', !ok); if (!ok) ui.offerPending = false; });
const send = o => {
  if(o && ['join','start','offer','exchange','offerReply'].includes(o.t)) PhoneAudio.play(o.t==='offer'||o.t==='exchange'||o.t==='offerReply'?'trade':'ready');
  if(o && o.t==='plan' && o.engage===true) PhoneAudio.play('ready');
  conn.send(o);
};
function onMsg(m) {
  if (m.t === 'welcome') {
    C = m.consts; joined = true; joinErr = '';
    try { localStorage.setItem('sf_phone', JSON.stringify({ room: m.room, playerId: m.playerId, token: m.token })); } catch (e) { }
  }
  if (m.t === 'error') {
    joinErr = m.text; joined = false;
    const s = saved(); if (s) { try { localStorage.removeItem('sf_phone'); } catch (e) { } }
    render();
  }
  if (m.t === 'kicked') { joined = false; joinErr = 'The host removed you from the game.'; try { localStorage.removeItem('sf_phone'); } catch (e) { } pub = null; render(); }
  if (m.t === 'toast') { if (/offer|trade/i.test(m.text)) ui.offerPending = false; PhoneAudio.play(/fail|error|reject/i.test(m.text)?'alert':'trade'); toast(m.text); }
  if (m.t === 'replaced') { conn.stop(); replaced = true; render(); return; }
  if (m.t === 'state') { pub = m.pub; priv = m.priv; now = clockFrom(pub); onState(); }
}
let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pub && pub.phase === 'game') keepAwake(); });

// ───────── Helpers ─────────
const me = () => pub && priv && pub.players.find(p => p.id === priv.pid);
const AVof = p => C.AVATARS[p.avatar];
const G = () => pub && pub.game;
const hex = id => G() && G().hexes.find(h => h.id === id);
const lane = id => G() && G().lanes.find(l => l.id === id);
const TYPE_NAMES = { rock: 'Rock World', ice: 'Ice World', crystal: 'Crystal World', gas: 'Gas Giant', station: 'Trade Station', asteroid: 'Asteroid Field', void: 'Void', beacon: 'The Beacon' };
function hexName(id) { const h = hex(id); if (!h) return '?'; return h.name || TYPE_NAMES[h.type]; }
function laneName(id) { const l = lane(id); return l ? `${hexName(l.a)} ↔ ${hexName(l.b)}` : '?'; }
const sumCost = (a, b) => { const o = Object.assign({}, a); for (const [k, v] of Object.entries(b || {})) o[k] = (o[k] || 0) + v; return o; };
const canPay = (res, c) => Object.entries(c).every(([k, v]) => (res[k] || 0) >= v);
function cmdCost(c) {
  if (!c || !priv) return {};
  const K = priv.costs;
  if (c.type === 'found') return sumCost(K.found, { credits: priv.legal?.foundTolls?.[c.target] || 0 });
  if (c.type === 'spire') return K.spire;
  if (c.type === 'lane') { const lc = Object.assign({}, K.lanes[c.lane] || {}); if (ui.plan && ui.plan.play.some(p => heldKey(p.uid) === 'warp')) { const l = lane(c.lane); if (l) { lc.plasma = Math.max(0, lc.plasma - 1); lc.ore = Math.max(0, lc.ore - 1); } } return lc; }
  if (c.type === 'fleet') return { credits: (c.n || 0) * K.fleetEach };
  if (c.type === 'research') return K.research;
  return {};
}
const heldKey = uid => { const c = priv.held.find(x => x.uid === uid); return c ? c.key : null; };
function cmdTitle(c) {
  return { found: 'Found Outpost', spire: 'Raise Spire', lane: 'Open Hyperlane', fleet: 'Build Fleet', research: 'Research', strike: 'Strike' }[c.type];
}
function cmdDetail(c) {
  if (c.type === 'found' || c.type === 'spire') return hexName(c.target);
  if (c.type === 'lane') return laneName(c.lane);
  if (c.type === 'fleet') { let s = c.n ? `${c.n} at ${hexName(c.place)}` : 'No new Fleets'; if (c.move) s += ` · move ${c.move.n} to ${hexName(c.move.to)}`; return s; }
  if (c.type === 'research') return c.choice === 'mission' ? 'Draw a new Mission' : C.UPGRADES[c.choice].name;
  if (c.type === 'strike') return `${hexName(c.from)} → ${hexName(c.to)}`;
  return '';
}

// ───────── Plan sync ─────────
function ensurePlan() {
  const g = G();
  if (!g || g.phase !== 'plan') return;
  if (ui.planRound !== g.round || !ui.plan) {
    ui.planRound = g.round; ui.pick = null; ui.editSlot = null; ui.tab = 'console';
    ui.plan = JSON.parse(JSON.stringify(priv.plan || { cmds: Array(priv.commandSlots || 2).fill(null), backup: null, rank: [], play: [] }));
    ui.plan.cmds = Array.from({length: priv.commandSlots || 2},(_,i)=>ui.plan.cmds?.[i]||null);
    ui.plan.backup ||= null;
    if (!ui.plan.rank || !ui.plan.rank.length) ui.plan.rank = g.pool.map(c => c.uid);
    ui.ex = { give: null, get: null }; ui.offer = { to: null, give: {}, get: {} }; ui.prevOffersSent = null; ui.offerPending = false;
    if (navigator.vibrate) navigator.vibrate(60);
  }
  ui.plan.rank = ui.plan.rank.filter(u => g.pool.some(c => c.uid === u)).concat(g.pool.map(c => c.uid).filter(u => !ui.plan.rank.includes(u)));
}
function pushPlan(engage) {
  const o = { t: 'plan', cmds: ui.plan.cmds, backup: ui.plan.backup || null, rank: ui.plan.rank, play: ui.plan.play, supply: ui.plan.supply || null };
  if (engage !== undefined) o.engage = engage;
  else if (priv.engaged) o.engage = false;
  send(o);
}

// ───────── Render root ─────────
function onState() {
  if (!C) return;
  if (pub.phase === 'game') keepAwake();
  const g = G();
  if (g && g.phase !== 'plan') { ui.pick = (g.phase === 'setup' && g.setupTurn === priv.pid) ? ui.pick : null; }
  if (g && g.phase === 'setup' && g.setupTurn !== priv.pid) ui.setupSel = null;
  if (g && g.phase === 'setup' && g.setupTurn === priv.pid && ui.lastBuzz !== 'setup' + g.hexes.filter(h => h.owner === priv.pid).length) { ui.lastBuzz = 'setup' + g.hexes.filter(h => h.owner === priv.pid).length; if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
  ensurePlan();
  if(g){
    const phaseKey=String(g.round)+':'+g.phase;
    if(PhoneAudio.lastKey && PhoneAudio.lastKey !== phaseKey){
      if(g.phase==='era') PhoneAudio.play('turn');
      else if(g.phase==='income') PhoneAudio.play('storm');
      else if(g.phase==='over') PhoneAudio.play('victory');
    }
    if (PhoneAudio.lastKey !== phaseKey && PhoneAudio.lastKey !== null) {
      announce(`Round ${g.round}: ${g.phase} phase${g.phase === 'era' && g.mode === 'advanced' ? '. Choose an era upgrade when it is your turn.' : '.'}`);
    }
    PhoneAudio.lastKey=phaseKey;
  } else PhoneAudio.lastKey=null;
  if (g && g.phase === 'plan' && priv && ui.prevOffersSent !== null && priv.offersSent > ui.prevOffersSent) {
    ui.offer = { to: null, give: {}, get: {} }; ui.offerPending = false; toast('Offer sent — awaiting their decision');
  }
  if (priv) ui.prevOffersSent = priv.offersSent;
  // incoming offer → modal
  if (priv && priv.offersIn && priv.offersIn.length) { const o = priv.offersIn[0]; if (ui.lastSeenOffer !== o.id) { ui.lastSeenOffer = o.id; ui.modal = 'offer'; if (navigator.vibrate) navigator.vibrate([60, 40, 60]); PhoneAudio.play('alert'); } }
  else if (ui.modal === 'offer') ui.modal = null;
  render();
}
function render() {
  if (replaced) {
    ['top', 'resbar', 'tabs'].forEach(id => $(id).hidden = true); $('mapBox').classList.remove('show'); $('modal').classList.remove('show');
    set('head', `<h2 style="margin-top:1.2rem">Playing on another device</h2><p class="lead">Your seat was opened on another phone or tab, so this one stepped aside.</p>`);
    set('body', ''); set('foot', `<button class="btn primary" id="takeBack">Use this device instead</button>`);
    $('takeBack').onclick = () => { replaced = false; conn.restart(); render(); };
    return;
  }
  const showGame = joined && pub && pub.phase === 'game' && G();
  $('phoneIntel').hidden = !showGame;
  $('phoneIntel').setAttribute('aria-pressed',String(Boolean(showGame && ui.intel)));
  if (!showGame) ui.intel = false;
  $('top').hidden = !(joined && pub && priv);
  $('resbar').hidden = !showGame;
  $('tabs').hidden = true;
  let mapOn = false, mapH = 0;
  if (!joined || !pub) { renderJoin(); }
  else if (pub.phase === 'lobby') { renderTop(); renderLobby(); }
  else if (showGame) { renderTop(); renderRes(); const r = ui.intel ? renderIntel() : renderGame(); mapOn = r.map; mapH = r.h || 0; }
  setMarks();
  if (ui.intel) set('pickAssist',''); else renderPickAssist();
  const box = $('mapBox');
  box.classList.toggle('show', mapOn);
  if (mapOn) {
    const h = mapH || Math.round(Math.min(innerHeight * 0.5, innerWidth * 0.95));
    if (box.style.height !== h + 'px') { box.style.height = h + 'px'; requestAnimationFrame(() => map.resize()); }
    map.setState(pub, C.AVATARS);
  }
  renderModal();
  synchroniseDialogFocus();
}
function set(id, html) { const el = $(id); if (el.innerHTML !== html) el.innerHTML = html; }

// ───────── Join ─────────
function renderJoin() {
  set('head', `<div class="phone-brand"><div class="phone-brand-label">INTERSTELLAR COMMAND NETWORK</div><picture><source media="(max-width: 750px)" srcset="art/brand/starfall-logo-mobile.png"><img src="art/brand/starfall-logo.png" alt="Starfall Lanes"></picture><div class="tagline">EIGHT HOUSES · ONE CLUSTER</div><p class="lead">Your phone is your starship command console. Scan the TV, choose a house, and shape the galaxy.</p></div>`);
  const s = saved();
  set('body', `<label class="f" for="jc">Game code</label><input id="jc" class="code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(urlRoom || (s && s.room) || '')}">
    <label class="f" for="jn">Your name</label><input id="jn" type="text" maxlength="14" autocomplete="nickname" placeholder="Optional" value="${esc(localStorage.getItem('sf_name') || '')}">
    ${joinErr ? `<div class="err" role="alert">${esc(joinErr)}</div>` : ''}
    <div class="phone-welcome"><strong>New commander?</strong><p>Start with <a href="/how-to-play.html" target="_blank" rel="noopener">How to Play</a> for a simple 2-minute explanation, or explore <a href="/lore.html" target="_blank" rel="noopener">the story of the Starfall Cluster</a>. Return here to join.</p></div>`);
  set('foot', `<button class="btn primary" id="jgo">Join game</button>`);
  $('jgo').onclick = () => {
    const room = $('jc').value.trim().toUpperCase(), name = $('jn').value.trim();
    if (room.length !== 4) { joinErr = 'Enter the 4-letter code from the TV.'; return render(); }
    try { localStorage.setItem('sf_name', name); } catch (e) { }
    send({ t: 'join', room, name });
  };
}

// ───────── Top bar ─────────
function renderTop() {
  const p = me(); if (!p) return;

// Progress is advisory, derived from public sectors and the player's private Missions.
// The server alone determines completion, including network connection rules.
function missionProgress(m) {
  const g = G(); if (!g || !priv) return null;
  const owned = g.hexes.filter(h => h.owner === priv.pid);
  let current = 0, total = 0, detail = '';
  if (m.type === 'hold') { current = owned.filter(h => h.type === m.world).length; total = 3; detail = `${Math.min(current, total)} of 3 worlds owned`; }
  else if (m.type === 'spires') { current = owned.filter(h => h.build === 'spire' || h.build === 'mega').length; total = 2; detail = `${Math.min(current, total)} of 2 Spires owned`; }
  else if (m.type === 'lanes') { current = g.lanes.filter(l => l.owner === priv.pid).length; total = 3; detail = `${Math.min(current, total)} of 3 hyperlanes owned`; }
  else if (m.type === 'asteroid') { current = Math.max(0, ...owned.filter(h => h.type === 'asteroid').map(h => h.fleets)); total = 3; detail = `${Math.min(current, total)} of 3 Fleets on your strongest Asteroid Field`; }
  else if (m.type === 'link' || m.type === 'beacon') { detail = m.met || m.done ? 'Network connected' : 'Complete your connected route'; }
  if (m.done) { current = total; detail = 'Completed in an earlier Reveal'; }
  return { current: Math.min(current, total), total, detail };
}

// Galaxy Intel is a complete textual alternative to the visual Canvas map.
// All information comes from PUBLIC game state. Secret missions and hands never enter this view.
function getIntelRows(g, filter) {
  const storm = new Set([...(g.storm || []), ...(g.twin || [])]);
  const next = new Set(g.ghost || []);
  const players = new Map(pub.players.map(p => [p.id, p]));
  const filtered = g.hexes.filter(h => {
    if (filter === 'mine') return h.owner === priv.pid;
    if (filter === 'rivals') return h.owner && h.owner !== priv.pid;
    if (filter === 'open') return !h.owner && !['void','beacon'].includes(h.type);
    if (filter === 'storm') return storm.has(h.id) || next.has(h.id);
    return true;
  });
  // Stable order: own sectors first, then rival sectors, then free and immutable hexes.
  filtered.sort((a,b)=>{
    const score = h=>h.owner === priv.pid?0:h.owner?1:['void','beacon'].includes(h.type)?3:2;
    return score(a)-score(b)||String(a.name||TYPE_NAMES[a.type]).localeCompare(String(b.name||TYPE_NAMES[b.type]))||a.id.localeCompare(b.id);
  });
  return filtered.map(h=>{
    const owner=players.get(h.owner);
    const ownership=h.owner === priv.pid?'Your house':owner?owner.name+' ('+C.AVATARS[owner.avatar].badge+')':h.type==='void'||h.type==='beacon'?'Cannot be claimed':'Unclaimed';
    const condition=storm.has(h.id)?'Solar Storm active':next.has(h.id)?'Storm forecast next round':'';
    const upgrade=h.build === 'mega'?'Megaspire':h.build === 'spire'?'Spire':h.build === 'outpost'?'Outpost':'';
    const details=[TYPE_NAMES[h.type]||h.type,ownership,upgrade,h.fleets?`${h.fleets} Fleet${h.fleets===1?'':'s'}`:'No Fleets',condition].filter(Boolean);
    return `<li class="intel-item${storm.has(h.id)?' storm-hit':''}${h.owner === priv.pid?' own-sector':''}"><strong>${esc(h.name || TYPE_NAMES[h.type] || 'Sector')} <small>(${esc(h.id)})</small></strong><small>${esc(details.join(' · '))}</small>${condition?`<em class="flag">${esc(condition)}</em>`:''}</li>`;
  });
}

    row.addEventListener('drop', e => { e.preventDefault(); const from = dragged; dragged = null; if (from !== null) moveDraftRank(from, +row.dataset.rank); });

  });
  document.querySelectorAll('.rank-handle').forEach(handle => {
    let from = null, target = null;
    handle.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return; // Native drag handles desktop mouse.
      from = +handle.closest('.draft-row').dataset.rank; target = from;
      handle.setPointerCapture(e.pointerId);
      handle.closest('.draft-row').classList.add('dragging');
    });
    handle.addEventListener('pointermove', e => {

      const hover = document.elementFromPoint(e.clientX, e.clientY)?.closest('.draft-row');
      if (hover) target = +hover.dataset.rank;
      rows.forEach(row => row.classList.toggle('drop-here', +row.dataset.rank === target));

      if (from === null) return;

      rows.forEach(row => row.classList.remove('dragging', 'drop-here'));

  const ok = of.to && canOffer && !ui.offerPending && Object.values(of.give).some(v => v > 0) && Object.values(of.get).some(v => v > 0) && canPay(res, of.give);
  if (of.to) h += `<button class="btn primary" id="sendOf" ${ok ? '' : 'disabled'} style="width:100%">${ui.offerPending ? 'Sending…' : 'Send trade offer'}</button>`;
  if (priv.offersOut.length) h += `<label class="f">Offers sent</label><div class="list">${priv.offersOut.slice().reverse().map(o => { const other = pub.players.find(p => p.id === o.to); const status = o.status || 'Waiting for reply'; return `<div class="row"><div class="grow"><b>To ${esc(other ? other.name : 'another house')}</b><small>${esc(tradeBundleText(o.give))} → ${esc(tradeBundleText(o.get))}</small></div><span class="offer-status ${esc(o.status || '')}">${esc(status)}</span></div>`; }).join('')}</div>`;
  h += `</section>`;
  set('head', h); set('body', ''); engageFoot();
  document.querySelectorAll('[data-give]').forEach(b => b.onclick = () => { ex.give = b.dataset.give; if (ex.get === ex.give) ex.get = null; render(); });
  document.querySelectorAll('[data-get]').forEach(b => b.onclick = () => { ex.get = b.dataset.get; render(); });
  if ($('doEx')) $('doEx').onclick = () => { send({ t: 'exchange', give: ex.give, get: ex.get }); };
  document.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { of.to = b.dataset.to; render(); });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const side = b.dataset.s, k = b.dataset.k, max = side === 'give' ? res[k] : 9; of[side][k] = Math.max(0, Math.min(max, (of[side][k] || 0) + +b.dataset.d)); render(); });
  if ($('sendOf')) $('sendOf').onclick = () => { if (!ok) return; ui.offerPending = true; send({ t: 'offer', to: of.to, give: of.give, get: of.get }); render(); };
  return { map: false };
}
function renderMyMissions() {
  let h = '';
  if (priv.surveyOffer) h += `<h2>Survey Drone</h2><p class="lead">Choose one of these secret Missions to keep.</p><div class="list">${priv.surveyOffer.map(m => `<button class="card" data-sv="${m.uid}"><span class="tag">+${m.inf}</span><b>${esc(m.text)}</b><p>Tap to keep</p></button>`).join('')}</div>`;
  const done = priv.missions.filter(m => m.done).length, ready = priv.missions.filter(m => !m.done && m.met).length;
  h += `<h2 style="margin-top:${priv.surveyOffer ? '1.2rem' : 0}">Secret Missions</h2><p class="lead">Track progress here. The server checks Missions at the end of Reveal; your TV only shows them once scored.</p>
    <div class="mission-summary"><span>${done} of ${priv.missions.length} completed</span><span>${ready ? `${ready} ready to score` : 'Keep expanding'}</span></div>`;
  if (priv.perks) h += '<p class="note bad">Advanced mode: unfinished Missions cost a maximum of 1 Influence in total at game end.</p>';
  h += `<div class="list">${priv.missions.map(m => missionCard(m)).join('')}</div>`;
  set('head', h); set('body', '');
  document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => send({ t: 'survey', uid: b.dataset.sv }));
  engageFoot(); return { map: false };
}
function renderCards() {
  let h = `<h2>Held cards</h2><p class="lead">Play one now and it works during this round's Reveal. You can hold 3.</p>`;
  if (!priv.held.length) h += `<p class="note">No held cards. Draft them from the pool.</p>`;
  h += `<div class="list">${priv.held.map(c => { const d = C.DRAFT[c.key], pl = ui.plan.play.find(x => x.uid === c.uid); return `<button class="card${pl ? ' on' : ''}" data-play="${c.uid}"><span class="tag">${pl ? '✔ Playing' : 'Tap to play'}</span><b>${esc(d.name)}</b><p>${esc(d.text)}${pl && pl.target ? ` — ${esc(hexName(pl.target))}` : ''}</p></button>`; }).join('')}</div>`;
  if (priv.kept.length) h += `<h2 style="margin-top:1.2rem">Kept cards</h2><div class="list">${priv.kept.map(c => `<div class="card"><b>${esc(C.DRAFT[c.key].name)}</b><p>${esc(C.DRAFT[c.key].text)}</p></div>`).join('')}</div>`;
  if (priv.upgrades.length) h += `<h2 style="margin-top:1.2rem">Upgrades</h2><div class="list">${priv.upgrades.map(k => `<div class="card"><b>${esc(C.UPGRADES[k].name)}</b><p>${esc(C.UPGRADES[k].text)}</p></div>`).join('')}</div>`;
  if (priv.perks) h += `<h2 style="margin-top:1.2rem">House perk</h2><div class="card"><p>${esc(AVof(me()).perk)}</p></div>`;
  set('head', h); set('body', '');
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    const uid = b.dataset.play, on = ui.plan.play.some(x => x.uid === uid);
    if (on) { ui.plan.play = ui.plan.play.filter(x => x.uid !== uid); pushPlan(); return render(); }
    if (heldKey(uid) === 'shields') { ui.pick = { kind: 'shields', d: { uid } }; return render(); }
    ui.plan.play.push({ uid }); pushPlan(); render();
  });
  engageFoot();
  return { map: false };
}

// ───────── Sector choice: map + accessible, deterministic list ─────────
function pickSectorIds() {
  if (!ui.pick || !G() || !priv) return [];
  const P = ui.pick, d = P.d || {}, L = priv.legal || {};
  if (P.kind === 'setup') return G().setupTurn === priv.pid ? priv.setupLegal || [] : [];
  if (P.kind === 'found' || P.kind === 'spire') return L[P.kind] || [];
  if (P.kind === 'shields') return L.shields || [];
  if (P.kind === 'fleet') return P.step === 0 ? L.fleetPlace || [] : d.from ? (L.move || []).filter(x => x[0] === d.from).map(x => x[1]) : [...new Set((L.move || []).map(x => x[0]))];
  if (P.kind === 'strike') return d.from ? (L.strike || []).filter(x => x[0] === d.from).map(x => x[1]) : [...new Set((L.strike || []).map(x => x[0]))];
  return [];
}
function selectSector(id) {
  if (!ui.pick || !G() || !priv) return;
  const P = ui.pick, d = P.d || {}, L = priv.legal || {};
  if (!pickSectorIds().includes(id)) return;
  if (P.kind === 'setup') ui.setupSel = id;
  else if (['found','spire','shields'].includes(P.kind)) d.target = id;
  else if (P.kind === 'fleet' && P.step === 0) d.place = id;
  else if (P.kind === 'fleet' && P.step === 1) {
    if (!d.from) { d.from = id; d.to = null; d.mn = null; }
    else { d.to = id; d.mn = null; }
  } else if (P.kind === 'strike') {
    if (!d.from) { d.from = id; d.to = null; }
    else d.to = id;
  }
  render();
}
function renderPickAssist() {
  const P = ui.pick;
  if (!P || !priv || !G()) { set('pickAssist', ''); set('mapcap',''); return; }
  const ids = pickSectorIds();
  if (!ids.length || P.kind === 'lane' || P.kind === 'research') { set('pickAssist', ''); set('mapcap', '<span>Glowing = available</span><span>Striped = Solar Storm</span>'); return; }
  const d = P.d || {}, choice = P.kind === 'setup' ? ui.setupSel : (d.to || d.target || d.place || d.from);
  const topic = P.kind === 'setup' ? 'Landing sites' : P.kind === 'strike' ? d.from ? 'Enemy targets' : 'Attacking Fleets' : P.kind === 'fleet' ? P.step ? d.from ? 'Move destination' : 'Move from' : 'Place new Fleets' : 'Available sectors';
  const selection = `<div class="pick-kicker"><span>${esc(topic)}</span><span>${ids.length} legal choice${ids.length === 1 ? '' : 's'}</span></div>`;
  set('pickAssist', selection + `<div class="pick-options">${ids.map(id => { const h = hex(id); return `<button class="pick-option${id === choice ? ' selected' : ''}" data-pick-sector="${esc(id)}" aria-pressed="${id === choice}"><strong>${esc(hexName(id))}</strong><small>${h ? `${esc(TYPE_NAMES[h.type])}${h.fleets ? ` · ${h.fleets} Fleets` : ''}` : ''}</small></button>`; }).join('')}</div><p class="pick-instructions">Tap an option here or a glowing sector on the map. Only legal targets are selectable.</p>`);
  document.querySelectorAll('[data-pick-sector]').forEach(b => b.onclick = () => {
    const id=b.dataset.pickSector, title=hexName(id);
    selectSector(id);
    (document.querySelector(`[data-pick-sector="${id}"]`) || document.querySelector('[data-pick-sector]'))?.focus();
    announce(`${title} selected. Continue choosing or confirm your order.`);
  });
  set('mapcap','<span>Glowing = available</span><span>Striped = Solar Storm</span>');
}
$('cv').addEventListener('click', e => {
  if (!ui.pick || !G()) return;
  const r = $('cv').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const P = ui.pick, d = P.d || {}, L = priv.legal || {};
  if (P.kind === 'lane') { const id = map.hitLane(x, y); if (id && L.lane.includes(id)) { d.lane = id; render(); } return; }
  selectSector(map.hit(x, y));
});

// ───────── Accessible modals ─────────
let dialogOpen = false, dialogReturnFocus = null;
function synchroniseDialogFocus(){
  const md=$('modal'), opened=md.classList.contains('show');
  md.setAttribute('aria-hidden', String(!opened));
  if(opened && !dialogOpen){
    dialogReturnFocus=document.activeElement;
    dialogOpen=true;
    document.body.classList.add('dialog-open');
    $('wrap').inert=true;
    ($('ofNo')||$('closeM')||$('sheet')).focus();
  } else if(opened && dialogOpen && !md.contains(document.activeElement)) {
    ($('ofNo')||$('closeM')||$('sheet')).focus();
  } else if(!opened && dialogOpen){
    dialogOpen=false;
    $('wrap').inert=false;
    document.body.classList.remove('dialog-open');
    const target=dialogReturnFocus?.isConnected ? dialogReturnFocus : $('hostBtn');
    dialogReturnFocus=null;
    if(target?.isConnected) target.focus();
  }
}
document.addEventListener('keydown', e=>{
  if(!dialogOpen) return;
  if(e.key==='Escape'){
    if(ui.modal==='host'){e.preventDefault(); ui.modal=null; render();}
    // Incoming trade requires an explicit accept/decline decision.
    return;
  }
  if(e.key!=='Tab') return;
  const controls=Array.from($('sheet').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[tabindex="0"]'));
  if(!controls.length){e.preventDefault(); $('sheet').focus(); return;}
  const first=controls[0],last=controls[controls.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===$('sheet'))){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
});
function renderModal() {
  const md = $('modal'), sh = $('sheet');
  if (ui.modal === 'offer' && priv && priv.offersIn && priv.offersIn.length) {
    const o = priv.offersIn[0], from = pub.players.find(p => p.id === o.from);
    const list = b => Object.entries(b).map(([k, v]) => `<span class="chip res-${k}">${v} ${ricon(k)}</span>`).join('');
    const ok = canPay(priv.res, o.get);
    sh.innerHTML = `<div style="display:flex;gap:.7rem;align-items:center">${avatarHTML(AVof(from), { size: 48 })}<div><h2 id="modalTitle" style="margin:0">${esc(from.name)} offers a trade</h2><p class="note" style="margin:0" id="ofT"></p></div></div>
      <label class="f">You get</label><div class="chips">${list(o.give)}</div>
      <label class="f">You give</label><div class="chips">${list(o.get)}</div>
      ${ok ? '' : '<p class="note bad">You don’t have enough to accept.</p>'}
      <div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn" id="ofNo">Decline</button><button class="btn primary" id="ofYes" ${ok ? '' : 'disabled'}>Accept</button></div>`;
    md.classList.add('show');
    $('ofNo').onclick = () => { send({ t: 'offerReply', id: o.id, accept: false }); ui.modal = null; render(); };
    $('ofYes').onclick = () => { send({ t: 'offerReply', id: o.id, accept: true }); ui.modal = null; render(); };
    const tick = () => { const el = $('ofT'); if (!el) return; el.textContent = `${Math.max(0, Math.ceil((o.expires - now()) / 1000))} seconds to decide`; };
    tick(); clearInterval(renderModal.iv); renderModal.iv = setInterval(tick, 500);
    return;
  }
  if (ui.modal === 'host' && priv && priv.isHost && pub) {
    const g = G();
    let h = `<h2 id="modalTitle">Host menu</h2>`;
    if (g) {
      h += `<p class="lead">A bot can play for anyone who has left or dropped out. Hand control back when they return.</p><div class="list">${pub.players.filter(p => p.id !== priv.pid).map(p => `<div class="row">${avatarHTML(AVof(p), { size: 34, off: !p.connected })}<div class="grow"><b>${esc(p.name)}</b><small>${p.isAI ? 'Bot playing' : p.connected ? 'Connected' : 'Disconnected'}</small></div>${p.bot ? '' : `<button class="btn small" data-ai="${p.id}">${p.isAI ? 'Return control' : 'Bot takes over'}</button>`}</div>`).join('')}</div>`;
      h += `<div style="display:flex;flex-direction:column;gap:.5rem;margin-top:1rem"><button class="btn danger" id="endG">${g.phase === 'over' ? 'Back to lobby' : 'End game now and score it'}</button><button class="btn" id="closeM">Close</button></div>`;
    } else {
      h += `<div style="margin:.8rem 0;padding:.85rem;border:1px solid rgba(76,181,228,.35);border-radius:12px"><label style="display:flex;gap:.65rem;align-items:center;cursor:pointer"><input type="checkbox" id="playtestToggle" ${pub.playtestEnabled?'checked':''} style="width:22px;height:22px;accent-color:#33d6ff"><span><b>Playtest log</b><small style="display:block;color:var(--muted);margin-top:.2rem">Optional · off by default. Records timings, orders and trades for this game only. No names or actions are sent to an external service.</small></span></label></div>`;
      h += `<button class="btn" id="closeM">Close</button>`;
    }
    h += `<section class="trade-section"><b>Reveal speed</b><p class="note">Normal: 600 ms per command / 1,500 ms per Strike. Fast: 250 / 700 ms. The server decides the result in the same order.</p><div class="seg" style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem"><button data-speed="normal" class="${pub.revealSpeed === 'normal' ? 'on' : ''}" aria-pressed="${pub.revealSpeed === 'normal'}">Normal</button><button data-speed="fast" class="${pub.revealSpeed === 'fast' ? 'on' : ''}" aria-pressed="${pub.revealSpeed === 'fast'}">Fast</button></div></section>`;
    sh.innerHTML = h; md.classList.add('show');
    document.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => send({ t: 'toAI', pid: b.dataset.ai }));
    document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { send({ t: 'revealSpeed', speed: b.dataset.speed }); });
    if ($('playtestToggle')) $('playtestToggle').onchange = e => send({ t: 'playtestToggle', enabled: !!e.target.checked });
    if ($('endG')) $('endG').onclick = () => { send({ t: 'endGame' }); ui.modal = null; render(); };
    $('closeM').onclick = () => { ui.modal = null; render(); };
    return;
  }
  md.classList.remove('show'); clearInterval(renderModal.iv);
}
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && ui.modal === 'host') { ui.modal = null; render(); } });

// ───────── Loop ─────────
function frame(t) { if ($('mapBox').classList.contains('show')) map.draw(t); requestAnimationFrame(frame); }
addEventListener('resize', () => { map.resize(); render(); });
requestAnimationFrame(frame);
render();
</script>
</body>
</html>

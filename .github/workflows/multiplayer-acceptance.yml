name: Starfall Lanes — multiplayer acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        # This project has no package-lock.json yet; npm ci would fail.
        run: npm install --no-audit --no-fund
      - name: Full offline tests
        run: npm test
      - name: Phase 8-10 release audit
        run: npm run test:release
      - name: Real WebSocket multiplayer acceptance
        run: npm run test:live

name: Apply reviewed Phase 4 gameplay update
on:
  push:
    branches:
      - review-phase4-deploy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out guarded deployment branch
        uses: actions/checkout@v4
        with:
          ref: review-phase4-deploy
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble and validate the supplied Phase 4 code updates
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const tasks=[
            {prefix:'part',count:8,expectedSize:29768,expectedAdler:632545088,file:'/tmp/starfall-core.patch'},
            {prefix:'extra',count:6,expectedSize:21624,expectedAdler:2180528714,file:'/tmp/starfall-other.patch'}
          ];
          for(const task of tasks){
            const joined=Array.from({length:task.count},(_,i)=>fs.readFileSync('release-payload/'+task.prefix+(i+1)+'.b64','utf8').trim()).join('');
            let a=1,b=0;
            for(const ch of joined){a=(a+ch.charCodeAt(0))%65521;b=(b+a)%65521;}
            const checksum=((b<<16)|a)>>>0;
            if(joined.length!==task.expectedSize||checksum!==task.expectedAdler){
              throw new Error(task.prefix+' payload integrity failure: size '+joined.length+', Adler '+checksum);
            }
            const patch=zlib.brotliDecompressSync(Buffer.from(joined,'base64'));
            if(!patch.toString('utf8').startsWith('diff --git '))throw new Error('Invalid patch header');
            fs.writeFileSync(task.file,patch);
            console.log(task.prefix+': verified '+patch.length+' bytes');
          }
          NODE
      - name: Check and apply gameplay patch without overwriting sound or portraits
        shell: bash
        run: |
          git apply --check /tmp/starfall-core.patch
          git apply /tmp/starfall-core.patch
          git apply --check /tmp/starfall-other.patch
          git apply /tmp/starfall-other.patch
      - name: Install build-time dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Rebuild generated TV and phone pages
        run: npm run build
      - name: Run offline regression suite
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check lib/playtest.js
          find tests -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Commit tested source and remove temporary deployment payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -r -f release-payload
          git rm -f .github/workflows/apply-phase4-deploy.yml
          git diff --cached --exit-code >/dev/null && { echo "No changes generated"; exit 1; } || true
          git commit -m "Implement review Phases 2-4: playtest logs, hyperlane routes and backup orders"
          git push origin HEAD:review-phase4-deploy

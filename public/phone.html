:root{
  --bg:#E9EEF7;--panel:rgba(255,255,255,.92);--panel2:#F6F8FC;--line:rgba(14,20,36,.16);
  --accent:#0E8FB5;--accentText:#FFFFFF;--text:#0E1424;--muted:#4B5670;--good:#1F8A4C;--bad:#C0362C;--storm:#E8622A;
  --gold:#A87A00;--shadow:0 6px 24px rgba(14,20,36,.12);--outline:#0E1424;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070A16;--panel:rgba(20,26,46,.92);--panel2:#1B2340;--line:rgba(154,167,199,.22);
  --accent:#33D6FF;--accentText:#04111A;--text:#EAF1FF;--muted:#9AA7C7;--good:#4DDB86;--bad:#FF6B6B;--storm:#FF7A3D;
  --gold:#FFD45A;--shadow:0 6px 28px rgba(0,0,0,.45);--outline:#FFFFFF;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070A16;--panel:rgba(20,26,46,.92);--panel2:#1B2340;--line:rgba(154,167,199,.22);
  --accent:#33D6FF;--accentText:#04111A;--text:#EAF1FF;--muted:#9AA7C7;--good:#4DDB86;--bad:#FF6B6B;--storm:#FF7A3D;
  --gold:#FFD45A;--shadow:0 6px 28px rgba(0,0,0,.45);--outline:#FFFFFF;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.orb{font-family:Orbitron,Inter,system-ui,sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.av{position:relative;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 60%,#000));border:3px solid var(--outline);display:grid;place-items:center;overflow:visible}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.av-ini{font-family:Orbitron,sans-serif;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:calc(var(--s) * .34)}
.av-badge{position:absolute;right:-6%;bottom:-6%;width:44%;height:44%;border-radius:50%;background:var(--outline);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:calc(var(--s) * .24);line-height:1;border:2px solid var(--c)}
.av.mood-smug{box-shadow:0 0 0 4px var(--gold),0 0 22px var(--gold)}
.av.mood-furious{box-shadow:0 0 0 4px var(--bad),0 0 22px var(--bad);animation:shake .45s 2}
.av.off{filter:grayscale(1) brightness(.7)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.res-ore{--rc:#C0533F}.res-ice{--rc:#3FA9D9}.res-crystal{--rc:#8A4FD8}.res-plasma{--rc:#E8861A}.res-credits{--rc:#D9A400}
.ricon{display:inline-block;width:1em;height:1em;vertical-align:-.15em;background:var(--rc);border:2px solid var(--outline)}
.res-ore .ricon,.ricon.res-ore{clip-path:polygon(30% 0,75% 8%,100% 45%,85% 90%,40% 100%,5% 75%,0 30%);border:0}
.res-ice .ricon,.ricon.res-ice{border-radius:2px}
.res-crystal .ricon,.ricon.res-crystal{clip-path:polygon(50% 0,100% 40%,75% 100%,25% 100%,0 40%);border:0}
.res-plasma .ricon,.ricon.res-plasma{border-radius:50%;box-shadow:inset 0 0 0 .18em rgba(255,255,255,.55)}
.res-credits .ricon,.ricon.res-credits{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-family:Inter,system-ui,sans-serif!important;font-weight:800;font-variant-numeric:tabular-nums}

/* Starfall Lanes cinematic design system. Keeps all functional buttons and
   shape badges, with accessible focus contrast and reduced-motion support. */
:root[data-theme="dark"] {
  --panel:rgba(10,23,43,.93);--panel2:#112640;
  --line:rgba(102,177,220,.28);--muted:#a5bdd5;
  --shadow:0 10px 34px rgba(0,5,20,.53);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:rgba(10,23,43,.93);--panel2:#112640;

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RES_NAMES = { ore: 'Ore', ice: 'Ice', crystal: 'Crystal', plasma: 'Plasma', credits: 'Credits' };
const ricon = k => `<span class="ricon res-${k}" aria-hidden="true"></span>`;
const ERA_IDS = ['frontier', 'expansion', 'ascension'];
const artFailed = new Set();
function initials(name) {
  const w = name.split(/[\s-]+/).filter(x => !/^(Commander|Matriarch|Archon|Dr\.|Captain)$/.test(x));
  return w.map(x => x[0]).join('').slice(0, 2).toUpperCase();
}
// Prefer the specific mood in the current era, then that era's neutral portrait,
// then the original Frontier master. This keeps a character's era outfit even
// when bespoke celebrating/under-pressure artwork has not yet been made.
function avatarArtFallback(el, neutral, master) {
  const attempted = el.getAttribute('src');
  artFailed.add(attempted);
  const next = [neutral, master].find(file => file !== attempted && !artFailed.has(file));
  if (next) el.src = next;
  else el.remove();
}
function avatarHTML(av, o) {
  o = o || {};
  const s = o.size || 48, mood = o.mood || 'neutral', era = ERA_IDS[o.era || 0] || 'frontier';
  const master = `art/avatars/${av.id}_frontier_neutral.webp`;
  const neutral = `art/avatars/${av.id}_${era}_neutral.webp`;
  const wanted = `art/avatars/${av.id}_${era}_${mood}.webp`;
  const src = [wanted, neutral, master].find(file => !artFailed.has(file));
  const img = src ? `<img src="${src}" alt="" loading="eager" onerror="avatarArtFallback(this, '${neutral}', '${master}')">` : '';
  const state = mood === 'furious' ? 'under pressure' : mood === 'smug' ? 'celebrating' : 'ready';
  const eraChip = s >= 68 ? `<span class="av-era" aria-hidden="true">${era === 'expansion' ? 'II' : era === 'ascension' ? 'III' : 'I'}</span>` : '';
  const moodChip = mood === 'furious' ? '<span class="av-state" aria-hidden="true">!</span>' : mood === 'smug' ? '<span class="av-state" aria-hidden="true">★</span>' : '';
  return `<div class="av era-${era} mood-${mood}${o.off ? ' off' : ''}" style="--c:${av.color};--s:${s}px;width:${s}px;height:${s}px" role="img" aria-label="${esc(av.name)}, ${era} era, ${state}"><span class="av-ini">${initials(av.name)}</span>${img}${eraChip}${moodChip}<span class="av-badge" aria-hidden="true">${av.badge}</span></div>`;
}
function costHTML(c) {
  const parts = Object.entries(c || {}).filter(([, v]) => v > 0).map(([k, v]) => `<span class="cost res-${k}">${v}${ricon(k)}</span>`);
  return parts.length ? parts.join('') : '<span class="cost">Free</span>';
}
function clockFrom(pub) {
  const off = pub.now - Date.now();
  return () => Date.now() + off;
}
function fmtTime(msLeft) {
  const s = Math.max(0, Math.ceil(msLeft / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* Shared TV/phone WebSocket adapter. Game UIs supply the role-specific
 * join/rejoin message; the transport never interprets game state.
 */
function Conn(onMsg, onOpen, onStatus) {
  let ws = null, ping = null, retry = null, stopped = false, generation = 0;
  function clearTimers() {
    if (ping !== null) { clearInterval(ping); ping = null; }
    if (retry !== null) { clearTimeout(retry); retry = null; }
  }
  function send(o) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
  }
  function open() {
    if (stopped) return;
    clearTimers();
    const current = ++generation;
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    } catch (_) {
      onStatus && onStatus(false);
      retry = setTimeout(() => { retry = null; open(); }, 1500);
      return;
    }
    ws.onopen = () => {
      if (stopped || current !== generation) return;
      onStatus && onStatus(true);
      onOpen(send);
      if (ping !== null) clearInterval(ping);
      ping = setInterval(() => send({ t: 'ping' }), 20000);
    };
    ws.onmessage = e => {
      if (stopped || current !== generation) return;
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m && typeof m === 'object' && !Array.isArray(m)) onMsg(m);
    };
    ws.onclose = () => {
      if (current !== generation) return;
      clearTimers();
      if (stopped) return;
      onStatus && onStatus(false);
      retry = setTimeout(() => { retry = null; open(); }, 1500);
    };
    ws.onerror = () => { /* The close handler owns the retry. */ };
  }
  function stop() {
    stopped = true;
    generation++;
    clearTimers();
    try { if (ws) ws.close(); } catch (_) { /* may already be closed */ }
    ws = null;
  }
  function restart() {
    if (!stopped) return;
    stopped = false;
    open();
  }
  open();
  return { send, stop, restart };
}

// Starfall Lanes — shared star-map renderer (TV + phone)
function MapView(canvas, opts) {
  opts = Object.assign({ stars: true, theme: 'dark', labels: true, quality: 1, cinematic: false, padTop: 0, padBottom: 0 }, opts || {});
  const ctx = canvas.getContext('2d');
  const S3 = Math.sqrt(3);
  let st = null, AV = [], hexById = {}, lanes = [], size = 20, ox = 0, oy = 0, W = 0, H = 0, dpr = 1;
  let marks = { legal: new Set(), sel: new Set(), laneLegal: new Set(), laneSel: null, arrow: null };
  let effects = [];
  let stormSet = new Set(), ghostSet = new Set(), twinSet = new Set();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // star layers (generated once)
  const stars = [];
  for (let i = 0; i < 260; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random() < .25 ? 2 : 1, r: Math.random() * 1.3 + .3, tw: Math.random() * 6 });
  const nebulae = [];
  for (let i = 0; i < 4; i++) nebulae.push({ x: Math.random(), y: Math.random(), r: .35 + Math.random() * .35, c: ['#2a1d6b', '#0d4a6b', '#5b1d5e', '#1d3f6b'][i] });

  const TYPE = {
    rock: { a: '#c98a6e', b: '#8a4b3c', c: '#3d1f1a' },
    ice: { a: '#f0ffff', b: '#8fd0ee', c: '#2f6f99' },
    crystal: { a: '#f0d8ff', b: '#9a5be0', c: '#35196b' },
    gas: { a: '#ffd59a', b: '#e8862a', c: '#6e2c0c' },
    station: { a: '#ffffff', b: '#aab6d3', c: '#3a4560' },
    asteroid: { a: '#cfc8bb', b: '#8f8a80', c: '#3c3a35' }
  };
  const theme = () => opts.theme === 'light'
    ? { bg: '#E9EEF7', plate: 'rgba(14,20,36,0.06)', plateLine: 'rgba(14,20,36,0.28)', label: '#0E1424', labelBg: 'rgba(255,255,255,0.85)', lane: 'rgba(14,20,36,0.45)', voidFill: 'rgba(14,20,36,0.12)', outline: '#0E1424' }
    : { bg: '#070A16', plate: 'rgba(160,190,255,0.05)', plateLine: 'rgba(120,160,255,0.22)', label: '#EAF1FF', labelBg: 'rgba(7,10,22,0.7)', lane: 'rgba(200,220,255,0.45)', voidFill: 'rgba(0,0,0,0.35)', outline: '#FFFFFF' };

  function colorOf(pid) {
    if (!st) return '#888';
    const p = st.players.find(x => x.id === pid);
    return p && AV[p.avatar] ? AV[p.avatar].color : '#888';
  }
  function badgeOf(pid) {
    const p = st && st.players.find(x => x.id === pid);
    return p && AV[p.avatar] ? AV[p.avatar].badge : '';
  }
  function setState(pub, avatars) {
    st = pub; AV = avatars || AV;
    const g = pub && pub.game; if (!g) return;
    hexById = {}; for (const h of g.hexes) hexById[h.id] = h;
    lanes = g.lanes;
    stormSet = new Set(g.storm); ghostSet = new Set(g.ghost); twinSet = new Set(g.twin);
    layout();
  }
  function setMarks(m) { marks = Object.assign({ legal: new Set(), sel: new Set(), laneLegal: new Set(), laneSel: null, arrow: null }, m || {}); }
  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1) * opts.quality;
    W = r.width; H = r.height;
    canvas.width = Math.max(1, Math.round(W * dpr)); canvas.height = Math.max(1, Math.round(H * dpr));
    layout();
  }
  function layout() {
    if (!st || !st.game) return;
    const R = st.game.R;
    const h = Math.max(50, H - opts.padTop - opts.padBottom);
    size = Math.min(W / (S3 * (2 * R + 1) + .4), h / (3 * R + 2 + .4));
    ox = W / 2; oy = opts.padTop + h / 2;
  }
  const cen = h => [ox + size * S3 * (h.q + h.r / 2), oy + size * 1.5 * h.r];
  function hexPath(x, y, s) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); ctx.lineTo(x + s * Math.cos(a), y + s * Math.sin(a)); }
    ctx.closePath();
  }
  function hit(px, py) {
    if (!st || !st.game) return null;
    const x = px - ox, y = py - oy;
    const q = (S3 / 3 * x - y / 3) / size, r = (2 / 3 * y) / size;
    let cx = q, cz = r, cy = -q - r;
    let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
    const dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);

    const h = hexById[rx + ',' + rz];
    return h ? h.id : null;
  }
  function hitLane(px, py) {
    let best = null, bd = size * 0.45;
    for (const l of lanes) {

  }
  function addFx(f) {
    if (!f || !st || !st.game) return;
    const now = performance.now();
    const E = (k, dur, extra) => effects.push(Object.assign({ k, t0: now, dur }, extra));
    // Cinematic effects are view-only; they never change ownership or rules.
    if (f.k === 'found') { E('beam', 1400, { hex: f.hex, color: colorOf(f.pid) }); if (opts.cinematic) E('construct', 1600, { hex: f.hex, color: colorOf(f.pid) }); }
    if (f.k === 'spire') { E('beam', 1400, { hex: f.hex, color: colorOf(f.pid) }); E('ring', 1600, { hex: f.hex, color: colorOf(f.pid) }); if (opts.cinematic) E('construct', 2200, { hex: f.hex, color: colorOf(f.pid), spire: true }); }
    if (f.k === 'lane') { E('sweep', 1300, { lane: f.lane, color: colorOf(f.pid) }); if (opts.cinematic) E('warp', 1450, { lane: f.lane, color: colorOf(f.pid) }); }
    if (f.k === 'fleet') E('pop', 1100, { hex: f.hex, color: colorOf(f.pid), text: '+' + f.n });
    if (f.k === 'move') { E('laser', 900, { from: f.from, to: f.to, color: colorOf(f.pid), soft: true }); if (opts.cinematic) E('convoy', 1150, { from: f.from, to: f.to, color: colorOf(f.pid) }); }
    if (f.k === 'clash') { E('laser', 1700, { from: f.from, to: f.to, color: colorOf(f.pid) }); E('ring', 1500, { hex: f.to, color: f.win ? colorOf(f.pid) : colorOf(f.did), delay: 700 }); if (opts.cinematic) E('battle', 2050, { from: f.from, to: f.to, color: colorOf(f.pid), shield: colorOf(f.did), win: f.win }); }
    if (f.k === 'card' && f.hex) E('ring', 1300, { hex: f.hex, color: '#33D6FF' });
    if (f.k === 'storm') E('storm', 1400, {});
    if (opts.cinematic && f.k === 'era') E('eraWave', 2300, { era: f.era });
    if (opts.cinematic && f.k === 'over') E('eraWave', 2800, { era: 3 });
    if (f.k === 'income') E('storm', 0, {});
    if (effects.length > 28) effects.splice(0, effects.length - 28);
  }

  function drawBackground(t) {
    const T = theme();
    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
    if (opts.theme === 'light' || !opts.stars) return;
    for (const n of nebulae) {
      const g = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * Math.max(W, H));
      g.addColorStop(0, n.c + '88'); g.addColorStop(1, n.c + '00');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    const drift = reduce ? 0 : t * 0.000006;
    for (const s of stars) {
      const x = ((s.x + drift * s.z) % 1) * W, y = s.y * H;

// Progress is advisory, derived from public sectors and the player's private Missions.
// The server alone determines completion, including network connection rules.
function missionProgress(m) {
  const g = G(); if (!g || !priv) return null;
  const owned = g.hexes.filter(h => h.owner === priv.pid);
  let current = 0, total = 0, detail = '';

  else if (m.type === 'spires') { current = owned.filter(h => h.build === 'spire' || h.build === 'mega').length; total = 2; detail = `${Math.min(current, total)} of 2 Spires owned`; }
  else if (m.type === 'lanes') { current = g.lanes.filter(l => l.owner === priv.pid).length; total = 3; detail = `${Math.min(current, total)} of 3 hyperlanes owned`; }
  else if (m.type === 'asteroid') { current = Math.max(0, ...owned.filter(h => h.type === 'asteroid').map(h => h.fleets)); total = 3; detail = `${Math.min(current, total)} of 3 Fleets on your strongest Asteroid Field`; }

  if (m.done) { current = total; detail = 'Completed in an earlier Reveal'; }

function getIntelRows(g, filter) {
  const storm = new Set([...(g.storm || []), ...(g.twin || [])]);
  const next = new Set(g.ghost || []);
  const players = new Map(pub.players.map(p => [p.id, p]));
  const filtered = g.hexes.filter(h => {
    if (filter === 'mine') return h.owner === priv.pid;
    if (filter === 'rivals') return h.owner && h.owner !== priv.pid;
    if (filter === 'open') return !h.owner && !['void','beacon'].includes(h.type);
    if (filter === 'storm') return storm.has(h.id) || next.has(h.id);
    return true;
  });
  // Stable order: own sectors first, then rival sectors, then free and immutable hexes.
  filtered.sort((a,b)=>{
    const score = h=>h.owner === priv.pid?0:h.owner?1:['void','beacon'].includes(h.type)?3:2;
    return score(a)-score(b)||String(a.name||TYPE_NAMES[a.type]).localeCompare(String(b.name||TYPE_NAMES[b.type]))||a.id.localeCompare(b.id);
  });
  return filtered.map(h=>{
    const owner=players.get(h.owner);
    const ownership=h.owner === priv.pid?'Your house':owner?owner.name+' ('+C.AVATARS[owner.avatar].badge+')':h.type==='void'||h.type==='beacon'?'Cannot be claimed':'Unclaimed';
    const condition=storm.has(h.id)?'Solar Storm active':next.has(h.id)?'Storm forecast next round':'';
    const upgrade=h.build === 'mega'?'Megaspire':h.build === 'spire'?'Spire':h.build === 'outpost'?'Outpost':'';
    const details=[TYPE_NAMES[h.type]||h.type,ownership,upgrade,h.fleets?`${h.fleets} Fleet${h.fleets===1?'':'s'}`:'No Fleets',condition].filter(Boolean);
    return `<li class="intel-item${storm.has(h.id)?' storm-hit':''}${h.owner === priv.pid?' own-sector':''}"><strong>${esc(h.name || TYPE_NAMES[h.type] || 'Sector')} <small>(${esc(h.id)})</small></strong><small>${esc(details.join(' · '))}</small>${condition?`<em class="flag">${esc(condition)}</em>`:''}</li>`;
  });
}

function bindDraftDrag() {
  let dragged = null;
  const rows = Array.from(document.querySelectorAll('.draft-row'));
  rows.forEach(row => {
    row.addEventListener('dragstart', e => { dragged = +row.dataset.rank; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragged)); row.classList.add('dragging'); });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drop-here'); });
    row.addEventListener('dragleave', () => row.classList.remove('drop-here'));
    row.addEventListener('drop', e => { e.preventDefault(); const from = dragged; dragged = null; if (from !== null) moveDraftRank(from, +row.dataset.rank); });
    row.addEventListener('dragend', () => { dragged = null; rows.forEach(x => x.classList.remove('dragging', 'drop-here')); });
  });
  document.querySelectorAll('.rank-handle').forEach(handle => {
    let from = null, target = null;
    handle.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return; // Native drag handles desktop mouse.
      from = +handle.closest('.draft-row').dataset.rank; target = from;
      handle.setPointerCapture(e.pointerId);
      handle.closest('.draft-row').classList.add('dragging');
    });
    handle.addEventListener('pointermove', e => {
      if (from === null) return;
      const hover = document.elementFromPoint(e.clientX, e.clientY)?.closest('.draft-row');
      if (hover) target = +hover.dataset.rank;
      rows.forEach(row => row.classList.toggle('drop-here', +row.dataset.rank === target));
    });
    const finish = (cancel) => {
      if (from === null) return;
      const f = from, t = target; from = null; target = null;
      rows.forEach(row => row.classList.remove('dragging', 'drop-here'));
      if (!cancel) moveDraftRank(f, t);
    };
    handle.addEventListener('pointerup', () => finish(false));
    handle.addEventListener('pointercancel', () => finish(true));
  });
}

  if (!P || !priv || !G()) { set('pickAssist', ''); set('mapcap',''); return; }
  const ids = pickSectorIds();
  if (!ids.length || P.kind === 'lane' || P.kind === 'research') { set('pickAssist', ''); set('mapcap', '<span>Glowing = available</span><span>Striped = Solar Storm</span>'); return; }
  const d = P.d || {}, choice = P.kind === 'setup' ? ui.setupSel : (d.to || d.target || d.place || d.from);
  const topic = P.kind === 'setup' ? 'Landing sites' : P.kind === 'strike' ? d.from ? 'Enemy targets' : 'Attacking Fleets' : P.kind === 'fleet' ? P.step ? d.from ? 'Move destination' : 'Move from' : 'Place new Fleets' : 'Available sectors';
  const selection = `<div class="pick-kicker"><span>${esc(topic)}</span><span>${ids.length} legal choice${ids.length === 1 ? '' : 's'}</span></div>`;
  set('pickAssist', selection + `<div class="pick-options">${ids.map(id => { const h = hex(id); return `<button class="pick-option${id === choice ? ' selected' : ''}" data-pick-sector="${esc(id)}" aria-pressed="${id === choice}"><strong>${esc(hexName(id))}</strong><small>${h ? `${esc(TYPE_NAMES[h.type])}${h.fleets ? ` · ${h.fleets} Fleets` : ''}` : ''}</small></button>`; }).join('')}</div><p class="pick-instructions">Tap an option here or a glowing sector on the map. Only legal targets are selectable.</p>`);
  document.querySelectorAll('[data-pick-sector]').forEach(b => b.onclick = () => {
    const id=b.dataset.pickSector, title=hexName(id);
    selectSector(id);
    (document.querySelector(`[data-pick-sector="${id}"]`) || document.querySelector('[data-pick-sector]'))?.focus();
    announce(`${title} selected. Continue choosing or confirm your order.`);
  });
  set('mapcap','<span>Glowing = available</span><span>Striped = Solar Storm</span>');
}
$('cv').addEventListener('click', e => {
  if (!ui.pick || !G()) return;
  const r = $('cv').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const P = ui.pick, d = P.d || {}, L = priv.legal || {};
  if (P.kind === 'lane') { const id = map.hitLane(x, y); if (id && L.lane.includes(id)) { d.lane = id; render(); } return; }
  selectSector(map.hit(x, y));
});

// ───────── Accessible modals ─────────
let dialogOpen = false, dialogReturnFocus = null;
function synchroniseDialogFocus(){
  const md=$('modal'), opened=md.classList.contains('show');
  md.setAttribute('aria-hidden', String(!opened));
  if(opened && !dialogOpen){
    dialogReturnFocus=document.activeElement;
    dialogOpen=true;
    document.body.classList.add('dialog-open');
    $('wrap').inert=true;
    ($('ofNo')||$('closeM')||$('sheet')).focus();
  } else if(opened && dialogOpen && !md.contains(document.activeElement)) {
    ($('ofNo')||$('closeM')||$('sheet')).focus();
  } else if(!opened && dialogOpen){
    dialogOpen=false;
    $('wrap').inert=false;
    document.body.classList.remove('dialog-open');
    const target=dialogReturnFocus?.isConnected ? dialogReturnFocus : $('hostBtn');
    dialogReturnFocus=null;
    if(target?.isConnected) target.focus();
  }
}
document.addEventListener('keydown', e=>{
  if(!dialogOpen) return;
  if(e.key==='Escape'){
    if(ui.modal==='host'){e.preventDefault(); ui.modal=null; render();}
    // Incoming trade requires an explicit accept/decline decision.
    return;
  }
  if(e.key!=='Tab') return;
  const controls=Array.from($('sheet').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[tabindex="0"]'));
  if(!controls.length){e.preventDefault(); $('sheet').focus(); return;}
  const first=controls[0],last=controls[controls.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===$('sheet'))){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
});
function renderModal() {
  const md = $('modal'), sh = $('sheet');
  if (ui.modal === 'offer' && priv && priv.offersIn && priv.offersIn.length) {
    const o = priv.offersIn[0], from = pub.players.find(p => p.id === o.from);
    const list = b => Object.entries(b).map(([k, v]) => `<span class="chip res-${k}">${v} ${ricon(k)}</span>`).join('');
    const ok = canPay(priv.res, o.get);
    sh.innerHTML = `<div style="display:flex;gap:.7rem;align-items:center">${avatarHTML(AVof(from), { size: 48 })}<div><h2 id="modalTitle" style="margin:0">${esc(from.name)} offers a trade</h2><p class="note" style="margin:0" id="ofT"></p></div></div>
      <label class="f">You get</label><div class="chips">${list(o.give)}</div>
      <label class="f">You give</label><div class="chips">${list(o.get)}</div>
      ${ok ? '' : '<p class="note bad">You don’t have enough to accept.</p>'}
      <div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn" id="ofNo">Decline</button><button class="btn primary" id="ofYes" ${ok ? '' : 'disabled'}>Accept</button></div>`;
    md.classList.add('show');
    $('ofNo').onclick = () => { send({ t: 'offerReply', id: o.id, accept: false }); ui.modal = null; render(); };
    $('ofYes').onclick = () => { send({ t: 'offerReply', id: o.id, accept: true }); ui.modal = null; render(); };
    const tick = () => { const el = $('ofT'); if (!el) return; el.textContent = `${Math.max(0, Math.ceil((o.expires - now()) / 1000))} seconds to decide`; };
    tick(); clearInterval(renderModal.iv); renderModal.iv = setInterval(tick, 500);
    return;
  }
  if (ui.modal === 'host' && priv && priv.isHost && pub) {
    const g = G();
    let h = `<h2 id="modalTitle">Host menu</h2>`;
    if (g) {
      h += `<p class="lead">A bot can play for anyone who has left or dropped out. Hand control back when they return.</p><div class="list">${pub.players.filter(p => p.id !== priv.pid).map(p => `<div class="row">${avatarHTML(AVof(p), { size: 34, off: !p.connected })}<div class="grow"><b>${esc(p.name)}</b><small>${p.isAI ? 'Bot playing' : p.connected ? 'Connected' : 'Disconnected'}</small></div>${p.bot ? '' : `<button class="btn small" data-ai="${p.id}">${p.isAI ? 'Return control' : 'Bot takes over'}</button>`}</div>`).join('')}</div>`;
      h += `<div style="display:flex;flex-direction:column;gap:.5rem;margin-top:1rem"><button class="btn danger" id="endG">${g.phase === 'over' ? 'Back to lobby' : 'End game now and score it'}</button><button class="btn" id="closeM">Close</button></div>`;
    } else {
      h += `<div style="margin:.8rem 0;padding:.85rem;border:1px solid rgba(76,181,228,.35);border-radius:12px"><label style="display:flex;gap:.65rem;align-items:center;cursor:pointer"><input type="checkbox" id="playtestToggle" ${pub.playtestEnabled?'checked':''} style="width:22px;height:22px;accent-color:#33d6ff"><span><b>Playtest log</b><small style="display:block;color:var(--muted);margin-top:.2rem">Optional · off by default. Records timings, orders and trades for this game only. No names or actions are sent to an external service.</small></span></label></div>`;
      h += `<button class="btn" id="closeM">Close</button>`;
    }
    h += `<section class="trade-section"><b>Reveal speed</b><p class="note">Normal: 600 ms per command / 1,500 ms per Strike. Fast: 250 / 700 ms. The server decides the result in the same order.</p><div class="seg" style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem"><button data-speed="normal" class="${pub.revealSpeed === 'normal' ? 'on' : ''}" aria-pressed="${pub.revealSpeed === 'normal'}">Normal</button><button data-speed="fast" class="${pub.revealSpeed === 'fast' ? 'on' : ''}" aria-pressed="${pub.revealSpeed === 'fast'}">Fast</button></div></section>`;
    sh.innerHTML = h; md.classList.add('show');
    document.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => send({ t: 'toAI', pid: b.dataset.ai }));
    document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { send({ t: 'revealSpeed', speed: b.dataset.speed }); });
    if ($('playtestToggle')) $('playtestToggle').onchange = e => send({ t: 'playtestToggle', enabled: !!e.target.checked });
    if ($('endG')) $('endG').onclick = () => { send({ t: 'endGame' }); ui.modal = null; render(); };
    $('closeM').onclick = () => { ui.modal = null; render(); };
    return;
  }
  md.classList.remove('show'); clearInterval(renderModal.iv);
}
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && ui.modal === 'host') { ui.modal = null; render(); } });

// ───────── Loop ─────────
function frame(t) { if ($('mapBox').classList.contains('show')) map.draw(t); requestAnimationFrame(frame); }
addEventListener('resize', () => { map.resize(); render(); });
requestAnimationFrame(frame);
render();
</script>
</body>
